<script>
const $=s=>document.querySelector(s);let clr=1,found=false,cur='home',named=false;
const toast=t=>{if(typeof P!=='undefined'&&P[cur]&&(P[cur].l==1||!named))t=t.replace(/Shade/g,'白日之影');if(typeof P!=='undefined'&&P[cur]&&P[cur].l==1&&!['talk','sim'].includes(cur)&&!t.startsWith('筆記本'))t=t.replace(/特工/g,'某探員');const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2800)};

// 暗色主題的注視效果：保留眼睛與眨眼，不再追蹤滑鼠
let eyeCanvas=document.createElement('canvas');
eyeCanvas.id='dark-eyes';
eyeCanvas.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40;display:none';
document.body.appendChild(eyeCanvas);
const eyeCtx=eyeCanvas.getContext('2d');
let eyeW=0,eyeH=0,eyeTimer=0,eyes=[],eyeMouse={x:innerWidth/2,y:innerHeight/2};
addEventListener('mousemove',e=>{eyeMouse.x=e.clientX;eyeMouse.y=e.clientY;},{passive:true});
addEventListener('touchmove',e=>{if(e.touches&&e.touches[0]){eyeMouse.x=e.touches[0].clientX;eyeMouse.y=e.touches[0].clientY;}},{passive:true});
function resizeEyes(){
  const dpr=Math.min(devicePixelRatio||1,2);
  eyeW=innerWidth;eyeH=innerHeight;
  eyeCanvas.width=Math.round(eyeW*dpr);eyeCanvas.height=Math.round(eyeH*dpr);
  eyeCanvas.style.width=eyeW+'px';eyeCanvas.style.height=eyeH+'px';
  eyeCtx.setTransform(dpr,0,0,dpr,0,0);
  eyes=Array.from({length:7},()=>({
    x:Math.random()*eyeW,y:Math.random()*eyeH,
    scale:.75+Math.random()*.65,
    blinkAt:Math.random()*500
  }));
}
resizeEyes();
addEventListener('resize',resizeEyes);
function drawDarkEyes(){
  eyeCtx.clearRect(0,0,eyeW,eyeH);
  const dark=document.documentElement.dataset.theme==='dark';
  eyeCanvas.style.display=dark?'block':'none';
  if(dark){
    eyeTimer++;
    const accent=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#8c83a8';
    eyes.forEach((e,i)=>{
      const phase=(eyeTimer+e.blinkAt+i*47)%430;
      const blink=phase<9?Math.max(.08,Math.abs(phase-4)/4):1;
      const w=25*e.scale,h=11*e.scale*blink;
      eyeCtx.globalAlpha=.3;
      eyeCtx.strokeStyle=accent;eyeCtx.lineWidth=1.2;
      eyeCtx.beginPath();eyeCtx.ellipse(e.x,e.y,w,h,0,0,Math.PI*2);eyeCtx.stroke();
      if(blink>.45){
        const dx=eyeMouse.x-e.x,dy=eyeMouse.y-e.y;
        const dist=Math.hypot(dx,dy)||1,shift=Math.min(7*e.scale,dist*.055);
        const px=e.x+dx/dist*shift,py=e.y+dy/dist*shift;
        eyeCtx.globalAlpha=.24;eyeCtx.fillStyle=accent;
        eyeCtx.beginPath();eyeCtx.ellipse(px,py,4.5*e.scale,4.5*e.scale,0,0,Math.PI*2);eyeCtx.fill();
      }
    });
  }
  eyeCtx.globalAlpha=1;
  requestAnimationFrame(drawDarkEyes);
}
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(drawDarkEyes);
else {
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#8c83a8';
  if(document.documentElement.dataset.theme==='dark'){
    eyeCanvas.style.display='block';eyeCtx.strokeStyle=accent;eyeCtx.globalAlpha=.3;
    eyes.forEach(e=>{eyeCtx.beginPath();eyeCtx.ellipse(e.x,e.y,25*e.scale,11*e.scale,0,0,Math.PI*2);eyeCtx.stroke()});
  }
}

let clk=0;const door=$('#door');
setTimeout(()=>door.classList.add('on'),6000);
$('#intro').addEventListener('click',e=>{if(e.target!==door&&++clk>=4)door.classList.add('on')});
door.onclick=()=>{if(!door.classList.contains('on'))return;door.classList.add('open');setTimeout(()=>{$('#intro').style.opacity=0;$('#app').style.display='block';setTimeout(()=>$('#intro').remove(),1300)},800)};
const iv=t=>t.split('\n').filter(Boolean).map(l=>dlg(l[0]=='研'?'研究員':'特工',l.slice(2))).join('');
const L=(k,t,r)=>{const c=P[k].l>clr;return `<a href="#" class="lk${c?' lc':''}" data-go="${k}"${r?` data-rec="${r}"`:''}${c?' title="需要更高權限"':''}>${c?'🔒 ':''}${t}</a>`};
const REL={home:['space','rules','base','hist','shade','exp'],space:['home','rules','anom','base'],rules:['home','space','sim','anom','appx','shade'],shade:['home','hist','rules','inc','fc','f2','rec','sim'],base:['home','rules','inc','rec'],sim:['rules','shade','inc','rec'],talk:['shade','f2'],f1:['hist','shade','fc','f2','appx'],appx:['shade','rules','fc','inc','rec'],f2:['shade','fc','f1','rec'],fc:['f2','inc','shade','rec','appx'],hist:['home','f1','shade','exp'],anom:['rules','space','rec','exp'],exp:['home','rules','anom','hist','f1'],inc:['shade','fc','rec','sim','base'],rec:['shade','fc','f2','inc','anom']};

home:{n:'樓層概述',l:1,h:()=>`<h2>實驗場（The Testing Ground）</h2>
<div class="meta"><div><i>現行難度</i>Class 1（現行探索評估）</div><div><i>檔案編號</i>M.E.G.CN-L-616（持續更新）</div><div><i>管理單位</i>M.E.G.CN 康幕委員會（最高管理層）</div><div><i>環境</i>結構可變；多數區域暫時穩定</div><div><i>實體</i>1（已確認：Shade）</div><div><i>主要異常</i>非線性空間、空間操縱、實驗系統控制</div><div><i>基地</i>無法維持常設基地</div></div>
<div class="card">M.E.G.CN 評估：Class 1 僅代表現行一般探索條件相對安全，不代表樓層本身無危險，也不代表 Shade 已失去改變環境或傷害進入者的能力。</div>
<div class="card"><b>檔案摘要</b>：Level -616「實驗場」是由白日之影維持的非線性樓層，進入者需通過規則各異的房間，通常要完成七項試煉才有機會離開。<br><b>閱讀指引</b>：先讀本頁、${L('rules','房間規則')}與${L('base','基地・出入口')}了解如何生存；再看${L('exp','探索紀錄')}與${L('anom','特殊物品與特殊狀態')}；想知道這些現象的來源，可進入「02 · 研究資料」。標有 🔒 的檔案需要權限；「05 · 非正式資料」收錄無法歸類的內容。</div>
<p>Level -616，研究部暫稱「實驗場」，是一處由大量房間、走廊與彼此重疊的空間構成的非線性樓層。它沒有可確認的中心、固定平面圖或穩定的遠近關係。進入者通常會先出現在一間空曠、乾淨、六面皆為淺色材料的立方體房間：牆面沒有接縫，沒有窗戶、家具或可辨識的光源，照明卻始終均勻。牆面不留污漬，地板也不會留下持久腳印。</p>
<p>初始房間並非每次都完全相同。一般流浪者多半遇到上述白色房間；少數人員可能被送往辦公室、住宅、長廊或與自身記憶相關的房間等其他空間，這類個案的詳細紀錄列為機密（見${L('f2','研究訪談')}、${L('fc','契約紀錄')}）。研究部判斷這是樓層依其過往接觸對象所作的辨識與安排。</p>
<p>進入後的最初幾分鐘，部分人會感到自己正被注視。現場沒有找到攝影機、鏡面或其他觀察裝置；聲音也可能從不存在的門後傳來。稍待片刻，牆上通常會出現一扇原本不存在的門。門出現前不建議敲擊牆面、破壞牆體或自行尋找裂縫。</p>

<h3>探索者須知</h3><ul><li>不要假設同一扇門會固定通往同一地點。</li><li>不要以牆面、走廊長度或指南針方向推斷返程路線。</li><li>進入合作房間前，先確認同伴是否仍在同一空間；聲音相同不代表位置相同。</li><li>若房間規則突然停止、出口接連消失，或聽見結構發出持續低鳴，應停止探索並尋找最近的可辨識出口。</li><li>不要攻擊 Shade，也不要把它偶爾提供的協助視為必然。</li></ul>
<p style="color:var(--mut);font-size:.9rem">（你剛才經歷的，就是最常見的初始房間。它不是整個樓層的全貌。）</p>`},
space:{n:'空間結構',l:1,h:()=>`<h2>空間結構</h2>
<p>整座實驗場由白日之影維持（見實體觀測檔案）。實驗場並非由單一建築向外延伸，而是由許多尺度、用途與物理條件不同的空間拼接而成。房間之間的連接關係會變動，且不遵循一般建築的內外、上下或遠近概念。兩扇相鄰的門可能通往相距甚遠的區域；走廊盡頭的門也可能回到進入者剛離開的房間。</p>
<h3>常見空間類型</h3><ul><li><b>生活空間：</b>住宅、宿舍、廚房、餐廳與無人的商店。物品外觀通常正常，但食物、電力與水源不保證可用。</li><li><b>工作空間：</b>辦公室、教室、檔案室、倉庫與實驗室。常出現標示、文件或設備，部分內容可能是誘導進入者作出選擇的線索。</li><li><b>過渡空間：</b>長廊、樓梯、電梯間與門廳。它們負責連接房間，但距離、方向與出口數量可能在進入者轉身後改變。</li><li><b>封閉空間：</b>沒有明顯出口，需完成指定任務、等待條件成立，或由外部開啟門扉才能離開。</li><li><b>異常空間：</b>重力、時間感、聲音傳遞或物體位置不符合常態；部分房間會重複同一段景象，或讓不同進入者看見不同版本。</li><li><b>記憶相關空間：</b>目前僅有少數探員的紀錄，細節列為機密。房間會出現與進入者經歷相似的物件、場景或聲音，但並不完全準確。</li></ul>
<h3>非線性連接</h3><p>目前最穩定的結論是：實驗場的門只代表「下一個空間的入口」，不代表固定方向或固定距離。相同門框、門牌甚至門後的聲音，都不能作為目的地相同的證據。曾有兩名探員先後通過同一扇門，抵達的卻是不同樓層；也有小隊在同時進門後被分配到不同房間，彼此仍能聽見對方，卻無法互相接觸。</p>
<p>測距儀、指南針與標記帶在此處只能作短時間參考。標記可能留在原地、出現在另一個房間，或在返回時指向不存在的路線。紙本紀錄與時間戳也可能出現不一致，因此探索紀錄應同時記下房間特徵、門的外觀、同行者與事件順序，不應只記錄方向。</p>
<h3>環境與感官異常</h3><p>照明通常穩定，卻找不到燈具；部分房間有風聲但沒有通風口，或能聽見隔牆另一側的談話，實際敲擊牆面卻沒有回音。少數空間會出現延遲聲響：進入者先聽見自己的腳步，數秒後才聽見回聲；也有房間會讓聲音從錯誤方向傳來。若同伴的聲音突然變得過於清晰，應先確認對方是否真的在附近。</p>
<h3>時間與距離</h3><p>樓層內的時間流速大多接近外界，但並非所有區域都能如此假定。限時房間的計時器可能與腕錶不同步；長廊的實際長度也可能在回頭、眨眼或跨越門檻後改變。現有紀錄不足以證明整個樓層存在統一的時間差，因此不建議以單次測量推算外界經過時間。</p>
<div class="card">試試看：走廊會在你回頭時改變。<div class="cor" id="cor" style="width:70%"><span id="cl2">長 40 公尺</span></div><button id="back">回頭看</button> <span id="cd"></span></div>`,i(){let n=0;$('#back').onclick=()=>{n++;const w=20+Math.random()*75;$('#cor').style.width=w+'%';$('#cl2').textContent='長 '+Math.round(w*.6)+' 公尺';$('#cd').textContent=['','入口還在。','入口換成了另一扇門。','你確定你是從這裡來的？','走廊沒有變，是你變了。'][Math.min(n,4)]}}},
rules:{n:'房間規則',l:1,h:()=>`<h2>房間規則</h2><p>部分房間會要求進入者完成指定任務才能前進。任務可能是回答問題、尋找物品、進行邏輯判斷、操作裝置或與其他人合作。房間規則通常會以文字、聲音、標示或環境變化呈現，但不保證說明完整，也不保證所有提示都可信。</p>
<details open><summary>一、限時房間</summary>房間會提供倒數計時器或其他時間提示。計時器未必與外界同步。早期紀錄中，時間結束可能直接改變房間結構並造成傷亡；現行版本通常會在時間結束後停止裝置或開啟出口，但仍不可故意等待測試。</details>
<details><summary>二、選擇房間</summary>提供兩個以上選項，選擇可能改變出口、房間結構、可用資源或其他進入者的處境。不一定存在正確答案。部分選項會以看似無害的文字呈現，實際結果可能延遲發生。</details>
<details><summary>三、合作房間</summary>需兩人以上分別持有線索、在不同位置操作裝置，或於限定時間內完成協作。聲音可能跨越空間傳遞，卻不代表同伴能抵達你的所在位置。進入前應先約定可辨識的確認方式，避免把模仿聲音誤認為隊友。</details>
<details><summary>四、異常房間</summary>可能出現重力改變、房間旋轉、地面移動、出口閃避、重複影像或物體位置錯置。若房間出現持續低鳴、牆面重疊或視野邊界扭曲，應視為結構不穩定徵兆，不要繼續觸碰裝置。</details>
<details><summary>五、觀察房間</summary>沒有明確任務，只有異常現象或來自其他房間的聲音。停留一段時間後，門通常會自行出現；但「沒有任務」不等於「沒有危險」，應避免觸碰未知物品或追逐聲源。</details>
<details><summary>六、記憶與感知房間</summary>房間可能重現進入者熟悉的場景、人物聲音或片段記憶。內容不一定真實，也不應被當成可靠證詞。若看見已離開樓層的人，先確認同行者的位置，不要單獨追隨。</details>
<details><summary>早期規則與現行規則</summary><ul><li><b>倒數結束</b>：早期可能直接改變房間結構並造成傷亡；現行通常停止裝置或開啟出口。</li><li><b>出口條件</b>：早期曾有出口僅允許一人通過，或需犧牲人員；現行多數出現其他通過方式。</li><li><b>完成條件</b>：早期部分實驗沒有可辨識的完成條件，條件不完整告知；現行多數房間有可理解的任務或可放棄的選項。</li><li><b>嚴重傷害</b>：早期傷害會持續累積；現行部分房間會提前中止（見下方協議）。</li><li><b>提示</b>：早期可能提供互相矛盾的線索；現行仍不保證提示完整可信。</li></ul><p class="note">並非所有房間都已更新，現行房間仍保留部分舊結構。</p></details>
<div class="card"><b>實驗中止協議</b>：現行紀錄顯示，部分實驗在探索者的身體或精神狀態瀕臨極限時會停止運作，結構穩定並重新開啟出口。此機制不會治療傷勢，也不是 M.E.G.CN 設置，且並非所有房間都已確認具備，不能當作安全保障。切勿為了觸發中止而刻意承受傷害。</div>
<p><button onclick="go('sim')">進入模擬體驗</button></p>`},
shade:{n:'實體觀測檔案',l:1,h:()=>`<h2>白日之影</h2>
<div class="chips"><span class="chip">隱密實體</span><span class="chip">個體</span><span class="chip">樓層共生型異常存在</span></div>
<div class="meta"><div><i>實體名稱</i>白日之影</div><div><i>暱稱</i><span class="keep">${named?'Shade':'█████'}</span></div><div><i>分類</i>隱密實體</div><div><i>存在形式</i>個體</div><div><i>性質</i>樓層共生型異常存在</div><div><i>主要活動範圍</i>${L('home','Level -616')}</div><div><i>其他區域</i>曾有透過陰影顯現及通訊設備干涉的紀錄；實際活動範圍與能力限制尚未確認</div><div><i>威脅評估</i>尚未正式評估</div><div><i>日常觀測</i>通常不主動攻擊一般流浪者</div><div><i>特殊情況</i>根基遭受嚴重破壞時，可能出現大規模敵對行為</div></div>
<div class="chips toc"><a href="#" class="chip" data-j="sh-desc">概述</a><a href="#" class="chip" data-j="sh-abil">能力</a><a href="#" class="chip" data-j="sh-beh">行為與應對</a><a href="#" class="chip" data-j="sh-event">根基與崩解</a><a href="#" class="chip" data-j="sh-bio">生理</a><a href="#" class="chip" data-j="sh-disc">發現與關係</a><a href="#" class="chip" data-j="sh-note">研究備註</a><a href="#" class="chip" data-j="sh-apx">觀測與檔案</a></div>

<details id="sh-desc" open><summary><b>概述</b></summary><ul>
<li><b>定位</b>：白日之影是與 Level -616 共生的隱密實體，也是這座實驗場的運作核心：樓層的空間結構、規則與根基都與它直接相連，樓層的運作與它的存在狀態互相影響。</li>
<li><b>互動方式</b>：它通常不以完整形體直接現身，而是透過空間變化、環境異常、通訊設備及其他可利用的媒介與外界互動。必要時，也能藉由環境中的陰影顯現自身。Level -616 內實驗室般的房間、特殊規則與異常現象（見${L('space','空間結構')}、${L('rules','房間規則')}），都由它設置與調整。</li>
<li><b>研究興趣</b>：它對人類在不同環境、心理壓力及特殊情境下的反應有強烈的觀察與研究興趣，並依受試者的行為調整實驗。</li>
<li><b>威脅評估</b>：尚未正式評估。日常觀測中通常不主動攻擊一般流浪者，主要威脅來自對樓層環境的控制；樓層根基遭受嚴重破壞時，可能出現大規模敵對行為。</li>
<li><b>風險</b>：它不理解疼痛、傷害與同意，因此即使實驗並非以傷害為目的，也可能造成嚴重的精神或生理負擔。</li>
<li><b>主要爭議</b>：它在樓層之外是否還有獨立的本體。</li></ul></details>

<details id="sh-abil" open><summary><b>能力</b>（共十項）</summary>
<p><b>樓層控制</b></p><ul>
<li><b>空間干涉</b>：能夠改變 Level -616 內的空間結構，包括調整房間之間的連接、改變通道位置，以及控制部分出口的出現與消失。此能力與樓層根基密切相關，根基受損時，其控制能力會受到影響。</li>
<li><b>環境操縱</b>：能夠干涉樓層內的環境及異常設施，啟動、停止或改變裝置的運作方式，並同時維持多個規則各異的房間。</li>
<li><b>遠距觀察</b>：能夠透過樓層結構感知其中的人類活動，並對特定行為作出反應，觀察範圍涵蓋所有實驗房間。</li>
<li><b>共生維持</b>：白日之影與 Level -616 的根基相互連結，能透過自身能力維持及干涉樓層的部分運作。根基受到嚴重破壞時，實體可能失去部分控制能力，甚至影響自身的存在狀態。</li></ul>
<p><b>顯現與傳訊</b></p><ul>
<li><b>陰影顯現</b>：能夠透過陰影顯現自身，並在不同陰影所在的位置出現。由於陰影廣泛存在於各種環境中，實體並不需要固定的顯現地點。</li>
<li><b>通訊干涉</b>：能夠干涉部分通訊設備，使特定訊號傳入指定設備。曾有特工透過對講機接收到流浪者的求救訊號，經確認，該訊號與白日之影的介入有關。</li>
<li><b>資訊觀測</b>：能夠接觸並閱讀部分網路資訊，包括後室相關論壇中的公開內容。實體似乎會藉此取得樓層以外的資訊。</li></ul>
<p><b>自身能力</b></p><ul>
<li><b>聲音模仿</b>：能夠模仿人類的聲音，並從不同位置發出聲響。尚無證據顯示其能同步複製對象的記憶、人格或思考方式。</li>
<li><b>靈魂干涉</b>：能夠直接接觸及干涉靈魂活動，並以此建立特殊關係。它可作用於靈魂與肉體的連結，造成無法以生理傷害解釋的反應與非物理痛苦，一般醫療手段無法判斷其嚴重程度，並曾對相關對象造成持續性的異常影響。</li>
<li><b>形態變化</b>：實體通常以黑色陰影的形式出現，亦曾呈現近似人類的輪廓。人形是它與人類交流時採用的形態。</li></ul>
</details>

<details id="sh-beh" open><summary><b>行為與應對</b></summary>
<p><b>日常行為</b>：白日之影通常不主動攻擊一般流浪者。日常行為是觀察、設置實驗環境，並依受試者的反應調整房間。它的好奇或友善不是安全保證。</p>
<p><b>攻擊方式</b>：沒有固定的直接攻擊手段。主要威脅來自對樓層環境的控制：改變房間規則、封閉出口，或使受試者暴露於異常現象之中。樓層根基受到嚴重威脅時，它的行為模式會改變（見「根基與崩解」）。</p>
<p><b>遭遇時的應對方式</b></p><ul>
<li><b>平時</b>：避免刻意挑釁，或試圖破壞實驗設施。</li>
<li><b>規則改變</b>：房間規則改變時，先確認當前環境與出口狀態（見${L('rules','房間規則')}、${L('base','基地・出入口')}）。</li>
<li><b>精神干擾</b>：出現明顯的精神干擾或感官異常時，盡快離開當前實驗區域。</li>
<li><b>大規模崩解</b>：樓層開始大規模崩解時，立即停止破壞行動，並尋找撤離途徑。</li>
<li><b>它親自現身</b>：若白日之影親自現身並開始攻擊，優先尋找撤離機會，不建議正面交戰；物理攻擊對其無效，且可能被視為敵意。</li>
<li><b>遇見探員</b>：若遇見自稱 M.E.G.CN 探員、正在處理樓層異常的人，請配合其引導，不要介入他與實體的交涉。他並非樓層管理者，也無法控制該實體。</li></ul></details>

<details id="sh-event"><summary><b>根基與崩解</b></summary>
<p><b>根基</b>：樓層根基是它存在的維持機制。根基遭到嚴重破壞時，白日之影將逐漸失去對樓層的控制，並可能影響自身的存在狀態。目前沒有足夠證據確認其後果，尚無法判定根基完全崩解是否會導致實體消亡；它會優先保護根基。</p>
<p><b>崩解</b>：樓層根基遭到嚴重破壞時，實驗房間會逐漸崩解，原有規則失去穩定，樓層內尚未離開的人將面臨危險，白日之影的行為模式也會隨之改變。具體經過與處置列為機密，見${L('inc','根基事件')}；也可在${L('sim','模擬體驗')}中親身經歷。</p></details>

<details id="sh-bio"><summary><b>生理</b></summary><ul>
<li><b>平時形態</b>：通常呈現為無固定輪廓的黑色陰影，近似一團流動的暗色物質。</li>
<li><b>交流時形態</b>：聚合成近似人形的輪廓，五官與肢體不穩定、難以辨識。</li>
<li><b>聲音</b>：並非由發聲器官產生。</li>
<li><b>內部結構</b>：沒有任何器官、骨骼或循環系統的證據，也從未取得可供分析的實體組織。</li></ul></details>

<details id="sh-disc"><summary><b>發現與特殊關係</b></summary>
<p><b>發現</b>：白日之影的存在與 Level -616 的異常現象一同被發現。早期探索隊伍多次回報樓層內有持續觀察他們的存在（見${L('exp','探索紀錄')}）。M.E.G.CN 其後確認它能以直接語言交流，並將其編入隱密實體檔案。更早期的接觸經過與相關人員的資料列為機密。</p>
<p><b>特殊關係</b>：白日之影與一名 M.E.G.CN 探員之間存在長期關係，細節列為機密（見${L('fc','契約紀錄')}）。他是 Level -616 重大事件的重要參與者之一，不是樓層的管理者或控制者，樓層的規則由白日之影與樓層根基決定。</p></details>

<details id="sh-note"><summary><b>研究備註</b></summary><p>白日之影並非完全無法理解人類，而是對疼痛、傷害、同意與個人身份等概念存在根本性的認知差異。它曾表現出保護特定人類的意願，但它所理解的善意，與人類所認定的並不相同。由於它與樓層共生，任何破壞樓層根基的行為都會同時影響它本身。</p></details>

<details id="sh-apx"><summary><b>觀測紀錄與相關檔案</b></summary>
<div class="apx"><div><b>檔案 1</b>　非公開音訊——人類行為指導紀錄<br>${L('rec','I-06 行為矯正錄音','I-06/01')}・${L('rec','通訊紀錄 02','02')}・${L('rec','通訊紀錄 07','07')}</div><div><b>檔案 2</b>　Level -616 實驗環境與異常現象紀錄<br>${L('space','空間結構')}・${L('rules','房間規則')}・${L('anom','特殊物品與特殊狀態')}・${L('exp','探索紀錄')}</div><div><b>檔案 3</b>　特殊事件紀錄——Level -616 根基崩解與實體介入<br>${L('inc','根基事件')}・${L('rec','通訊紀錄 12','12')}・${L('sim','模擬體驗')}・${L('hist','樓層歷史')}</div></div>
<details><summary>補充觀測紀錄</summary><p>有流浪者完成任務後聽見「完成了。」，迷路時看見一扇原本不存在的門並聽見「這邊。」；亦有人聽過「結束了。」。這些都是它對流浪者的簡短回應。</p><details><summary>特殊觀測紀錄 O-01～O-03</summary><b>O-01</b>：某隊完成試煉後，牆面出現新文字：「你們剛才為什麼沒有告訴他？」該隊確實發生過資訊隱瞞，但未曾在房間內公開討論。<br><b>O-02</b>：一名探索者獨自等待出口，向空房間問：「有人在嗎？」約十秒後，擴音設備回答：「有。」他再問對方是誰，設備不再發聲。<br><b>O-03</b>：試煉結束後，封閉的牆面出現一扇門，門後只有無法辨識的黑暗。隊伍沒有進入，約三分鐘後門自行關閉。</details><details><summary>接觸紀錄索引</summary><p>除上述 O-01～O-03 外，下列聲音或文字也出自白日之影：</p><ul><li>I-02 空白紀錄器：離開房間後自動生成的十秒內音訊</li><li>EX-02：螢幕追問「為什麼？」</li><li>EX-05：紙上寫下「可以。」</li><li>EX-09：牆面「你們不需要說實話。」</li><li>EX-10：「可以。」</li><li>EX-11：「知道了。」</li><li>EX-12：紙上「你們已經完成了。」</li></ul></details><details><summary>回應的共同特徵</summary>簡短、直接，沒有寒暄，似乎不熟悉人類的日常社交與隱含意義。常在人出現決策、沉默、放棄或求助的時刻發聲，回應之後多半伴隨出口開啟或規則停止。</details></details></details>
<div class="card">代碼提示：白日之影是組織的稱呼，不是它的名字。特工替它取的暱稱，就是權限三的鑰匙。</div>`},

base:{n:'基地・出入口',l:1,h:()=>`<h2>基地與出入口</h2><p>目前無法在實驗場建立常設基地。房間與走廊的連接關係會自行改變，物資存放位置無法長期確認，通訊也可能因空間分離而中斷。任何固定設施都可能在無預警的情況下被隔離、移位，或失去通往原區域的路徑。</p>
<h3>入口</h3><ul><li>進入沒有門把、表面平整的純白色門；此方式並非每次都能成功。</li><li>在空白房間內持續注視沒有接縫的牆面，等待門扉出現。不要敲擊或破壞牆面。</li><li>少數情況下，可能意外穿過不穩定的空間裂縫。裂縫位置與出現條件無法預測，不建議刻意尋找。</li></ul><p><b>已知入口</b>：Level 0 的長廊中，與牆面顏色不同、無把手的白色門；Level 1 倉庫區一間空無貨架的白色房間，入內後原入口消失；Level 11 無法正常使用的電梯，只有一個按鈕，樓層顯示器不出現任何數字，停止後通往初始房間。這些入口並非隨時存在。</p>
<h3>出口</h3><p>出口通常以原本不存在的門扉出現。完成房間任務、等待條件成立，或在現行實驗中止協議啟動後，都可能出現出口。門後可能通往相對安全的其他區域，也可能連接至其他異常樓層；進入者無法自行指定目的地。</p><p><b>常規出口</b>：至少完成七項試煉，順序因人員與房間而異。但有人未滿七項就獲得離開資格，也有隊伍完成七項後仍被要求進入額外房間（見 EX-12），因此不應視為絕對固定的規則。</p><p>Level 995「因果之地遊樂園」並非實驗場內部區域，僅在特定的樓層崩解事件中作為進入者的去向，詳見${L('inc','根基事件')}。</p>
<h3>導航與物資</h3><p>探索小隊應採取短距離移動、定時回報與同行者互相確認的方式。每次通過門扉前，記下門的顏色、材質、周圍物件與同行人數；若隊伍分散，不要只憑聲音追人。建議攜帶飲水、簡易醫療用品、可靠的照明與可獨立記錄時間的設備，但不得假設物品能跨房間取回。</p>
<h3>通訊限制</h3><p>無線電在部分區域可正常使用，在空間扭曲或房間分離時則可能只能單向發送。收不到回覆不代表總部沒有收到訊息；同樣地，聽見回覆也不代表訊號來自真正的總部。應預先約定失聯後的撤離原則，不要在樓層內無限期等待支援。</p>
`},
logA:{n:'附錄A 探索紀錄',l:1,h:()=>`<h2>現行探索紀錄</h2>
<details><summary>A-01 初始房間</summary>小隊皆出現在白色立方體，敲擊無中空。約六分鐘後右側出現門，門後是普通辦公室。無危險。</details>
<details><summary>A-02 異常出口</summary>探員第一次通過出口，抵達與原本相同的走廊；返回確認無變化，第二次通過卻抵達另一樓層。</details>
<details><summary>A-03 實體接觸</summary>${dlg('聲音','你為什麼不走？')}${dlg('流浪者','我在等同伴。')}沉默約十秒後，房間出現第二扇門。</details>
<details><summary>A-04 實驗中止</summary>流浪者的精神狀態到達極限，所有裝置停止，出口開啟。離開前聽見：「結束了。」</details>
<h3>M.E.G.CN 現行評估</h3><p>評估範圍與風險說明見${L('home','樓層概述')}。<span class="red" id="rd">████████</span>（點擊）</p>`,i(){$('#rd').onclick=e=>{e.target.textContent='不要把一個人當成整個樓層的保證。';e.target.classList.add('on')}}},
sim:{n:'模擬體驗',l:1,h:()=>`<h2>實驗場模擬</h2><p>你是新進入的流浪者。走完七步即可離開。你的身體與精神都有承受極限，任何一方到達極限，實驗便會中止。（魯莽的選項代價更大，也更容易使你到達極限。）</p>
<div>身體 <span class="bar" id="hp"><i style="width:100%"></i></span><span id="hv" hidden>10</span>　精神 <span class="bar"><i id="si" style="width:100%"></i></span><span id="sv" hidden>10</span></div>
<div id="room" class="card"></div><div id="ch"></div>`,i:sim},
talk:{n:'非正式交流',l:1,hid:1,h:()=>`<h2>對 Shade 說話</h2><p style="color:var(--mut);font-size:.9rem">它認識特工。對其他進入者，它只做觀察與紀錄。</p><div id="chat"><p class="sh">Shade：你好。這是特工教我的問候方式。</p></div><p><input id="say" placeholder="說點什麼，按 Enter 或送出"></p><p><button id="sendb">送出</button></p>`,i:talk},
f1:{n:'早期危險評估',l:2,h:()=>`<h2>早期危險評估</h2><div class="meta"><div><i>原始難度</i>Class 5</div><div><i>權限</i>高級研究人員</div></div>
<details open><summary>樓層規則的轉變</summary><p>早期紀錄顯示，實驗場曾以高風險實驗為主要運作方式，房間可能造成永久傷害或死亡，且出口不一定會在任務完成前出現。樓層規則其後逐步改變（原因與一名探員和 Shade 的長期接觸有關，見契約紀錄）：多數房間不再以致命結果作為完成條件，部分出口會在進入者需要時開啟，實驗也出現可中止的情況。這種轉變並非一次完成，現行環境仍保留早期結構與未明異常。</p></details>
<p>部分實驗沒有可辨識的完成條件，出口有時在進入者放棄希望後才出現；有人被迫連續進行多次實驗，也有小隊失聯，只在其他樓層找到遺物。不能因近期傷亡下降，就推定所有舊機制已失效。</p>
<details><summary>歷史紀錄A：早期樓層狀態</summary><p>早期進入者可能在毫無預警下被迫參與實驗，部分房間有明確的死亡條件。曾有六人探索隊進入某房間，出口僅允許一人通過，沒有其他出口，也無可破壞的牆面；倒數結束後房間開始縮小，最終只有一人離開。另一間具有 72 小時倒數計時器的房間，時間歸零後氧氣迅速下降，所有進入者均未能離開。</p><p><b>早期實驗特徵：</b>條件不完整告知；故意提供互相矛盾的線索；強制限制離開；傷害持續累積直到死亡；房間之間互相影響；失敗不一定立即死亡，但後續房間難度會增加。</p><p>探索人員曾以炸藥、槍械破壞房間，部分空間立即恢復，另一些直接轉移至不同結構，所有強行破壞均未能解除異常。也有人報告靈魂受到直接拉扯或撕裂：肉體完整，但靈魂與身體的連結異常。</p></details><div class="card warn">對 Shade 而言，只要研究對象仍然存活，實驗就不算失敗。這種認知造成大量傷亡。它對人類的興趣也包含情緒、選擇與社會關係，卻完全不符合人類的實驗倫理。</div>`},
f2:{n:'研究訪談',l:2,h:()=>`<h2>訪談紀錄</h2><div class="meta"><div><i>文件編號</i>TG-INT-01</div><div><i>地點</i>M.E.G.CN 臨時研究站（補問於臨時醫療站）</div><div><i>目的</i>確認歷史狀態與實體關係</div><div><i>訪談日期</i>20xx/██/██　共兩次（含補問）</div><div><i>訪談人員</i>研究部 ██████（兩名）</div><div><i>文件狀態</i>逐字轉寫・部分刪減</div></div>
<div class="stamps"><span class="stamp ">機密</span><span class="stamp s2">研究部存檔</span><span class="stamp s3">部分刪減</span><span class="stamp s2">已核對轉寫</span></div>
<details open><summary>第一次進入 <span class="stamp in s2">轉寫完成</span></summary>${dlg('研究員','你第一次進去的時候，樓層就是現在這個樣子嗎？')}${dlg('特工','不是。一開始的房間倒是差不多，白白的、空空的，會讓人以為這裡還沒裝潢完。然後門一開，裡面就完全不是那麼回事了。')}${dlg('特工','限時、二選一、合作、逃生，什麼都有。你知道那種明明走了十分鐘，回頭卻發現自己還站在原地的感覺嗎？那還算是比較簡單的。')}</details>
<details><summary>致命實驗</summary>${iv(`研:你是否曾在樓層裡遭遇致命性的實驗？\n特:有，而且不只一次。有些房間真的很不講道理，你連自己該做什麼都還不知道，倒數就先開始了。\n研:如果選錯了？\n特:看房間。有的只是受傷，有的直接死人。\n研:你能接受這種結果嗎？\n特:接受？不可能啊。有人在裡面，我沒辦法站在外面看。`)}${`<span class="ann">〔話題轉到傷亡時笑意明顯收斂，此題回答直接，不帶玩笑。〕</span>`}${iv(`研:即使會影響你自己的生存機率？\n特:要是每次都先算機率，我大概早就不在這裡了。`)}</details>
<details><summary>關於 Shade</summary>${iv(`研:你與它是什麼關係？\n特:關係？……朋友？哈哈，不然要怎麼說？`)}${`<span class="ann">〔對「關係」一題以反問與笑聲緩衝，未給出任何定義。〕</span>`}${iv(`研:你認為它具有敵意嗎？\n特:以前有。現在比較難說，因為它不太懂人類。它知道一個人在害怕、在受傷，卻不一定知道那代表什麼。\n研:它為什麼進行那些實驗？\n特:它想知道人類是什麼。\n研:包括你？\n特:尤其是我吧。`)}${dlg('特工','它像是從來沒有人教過它怎麼跟別人相處。')}${dlg('研究員','你把一個具備空間與靈魂干涉能力的異常實體，當成需要學習如何與人相處的對象？')}${dlg('特工','它很危險，這點我沒有否認。但危險和不懂事，本來就可以同時成立吧。')}${dlg('特工','我走進去，它就知道我來了。這就是我的聯絡方式。')}</details>
<details><summary>研究部側寫：實體的對話特徵 <span class="stamp in s2">側寫</span></summary><p>初次接觸的錄音見通訊紀錄 A01。研究人員認為，該存在可能不熟悉人類的日常社交，對話高度直接，也無法理解部分隱含意義。後續片段中它向特工詢問大量問題：人類為什麼會在恐懼時發笑、為什麼會幫助陌生人、為什麼會對沒有實際用途的事物感興趣、為什麼在明知可能失敗時繼續嘗試、為什麼需要名字。它對恐懼、同情與好奇有自己的理解方式，但與人類的情緒並不相同。</p></details>
<details><summary>實驗與解剖</summary>${iv(`研:它是否曾提出要解剖你？\n特:提過。我當然沒同意。它說：「可是我會讓你活著。」\n研:你如何阻止它？\n特:跟它說不行。現在它聽得進去，以前比較麻煩。`)}</details>
<details><summary>能力與物理攻擊</summary>${dlg('特工','空間那邊比較好懂：牆不見、走廊變長、出口跑到另一邊，它也能直接把人搬去別的地方。靈魂那邊碰到的是更裡面的東西，不是被刀劃到的感覺。')}${dlg('特工','物理攻擊的話，就像打空氣。刀子穿過去，它連躲都不用躲。')}${dlg('研究員','你認為它能被殺死嗎？')}${dlg('特工','不知道。我也沒打算試。')}${dlg('研究員','你的鐮刀呢？')}${dlg('特工','……這個我就不回答了，好嗎？我還想繼續跟它做朋友。')}</details>
<details><summary>樓層為什麼改變</summary>${dlg('研究員','你認為樓層為什麼變得安全了？')}${dlg('特工','因為我跟它談過，談了很久。談了什麼嘛……暫時保密。我只能說，它還是會觀察，只是現在大部分人都能平安離開，不用再有人受傷或死掉才算結束。')}${dlg('研究員','它有持續遵守這個改變嗎？')}${dlg('特工','我相信它記得。它現在會先問過再動手，至少現在，它會讓其他人離開。')}${dlg('研究員','記得和遵守不是同一件事。')}${dlg('特工','……嗯，我知道。它有時候還是會做很奇怪的事，像是把我弄得半死不活，然後問我還能不能繼續。')}${dlg('特工','你問它會不會放我走？大部分時候吧。我也沒說這裡是觀光景點嘛。')}</details>
<details><summary>契約與個人資料 <span class="stamp in">已刪減</span><span class="stamp in s3">機密</span></summary><p>此部分問答涉及契約與個人資料，列為高度機密，不在本檔案收錄，節錄見${L('fc','契約紀錄')}。</p></details>
<details><summary>如果它再開始實驗</summary>${dlg('研究員','你會怎麼做？')}${dlg('特工','我會回去。總得有人跟它說不行吧。')}${dlg('研究員','你不認為 M.E.G.CN 可以處理？')}${dlg('特工','你們可以試試看啊。不過你們得先找到一個能跟它好好說話的人。')}</details>
<div class="card">研究部建議：不得強制檢查、不得要求以武力測試 Shade、不得將受訪者視為唯一接觸手段；大規模異常時先通知他，而非派武裝小隊。</div><div class="srow"><span class="stamp s2">已核閱</span><span class="stamp s3">結束訪談</span></div>`},
fc:{n:'契約紀錄',l:3,h:()=>`<h2>機密檔案：契約相關紀錄</h2><div class="meta"><div><i>文件等級</i>高度機密</div><div><i>資料來源</i>特工口述、異常痕跡、未公開紀錄</div></div>
<p>特工於 Level -616「實驗場」與白日之影建立契約。據其口述，契約條件為實體停止傷害其所能觀察範圍內的人類，作為交換，特工須持續接受實體觀察。</p>
<p>契約成立後，雙方均受到異常影響。特工的五感及身體結構逐漸產生非人類化變異，背部出現與實體相關之異常痕跡；此外，實體似乎能在特定情況下干涉其周遭環境，曾多次出現出口異常生成、陷阱失效及致命攻擊偏移等紀錄。</p>
<p>另有一項未經特工事前同意的契約變更：實體取走其原始姓名。</p>
<p>目前所有可查證的個人紀錄中，該姓名均已無法辨識，統一顯示為「□□□」。實體似乎以此作為辨識及追蹤契約對象的方式，並不理解姓名對人類身分認同的意義。</p>
<p>特工後續為該實體取了暱稱「Shade」。</p>
<details><summary>研究部側寫：特工（TG-INT-01） <span class="stamp in s2">側寫</span><span class="stamp in">僅供內部參考</span></summary><ul><li><b>溝通風格</b>：以玩笑與反問緩衝，語氣輕鬆；談到他人安危時回答直接，不閃避。</li><li><b>迴避模式</b>：涉及契約、個人檔案與身體狀況的問題一律以玩笑帶過或拒答，其餘問題多半願意回答。</li><li><b>對實體的態度</b>：幾乎不見恐懼，也沒有崇拜或敵意；傾向把對方視為「尚未學會與人相處的對象」，並以此解釋它過去的行為。</li><li><b>風險認知</b>：多次把自身安全排在他人之後。建議留意其風險評估是否失衡，不宜以他的玩笑語氣推定「沒事」。</li><li><b>可信度</b>：陳述前後一致，與已知紀錄無明顯矛盾；未發現他隱瞞對其他人有立即危險的資訊。</li></ul></details>
<p>訪談後補充（補問於臨時醫療站）：離開前他回頭問：「${named?'你們覺得 Shade 這個暱稱怎麼樣？':'你們覺得 █████ 這個暱稱怎麼樣？'}」只是想知道會不會太隨便。<span class="stamp in s2">補問紀錄</span></p>
<div class="card">訪談後備註：特工多次以玩笑轉移話題，但在涉及契約與個人資料時明顯較為謹慎，並主動要求結束訪談。研究部認為雙方存在長期且複雜的關係，不建議進一步要求公開契約細節。</div>
<details><summary>異常標記</summary>背部肩胛骨周圍，向脊椎及下背部延伸。並非刺青或傷疤，結構似乎已與身體組織結合。特工通常刻意遮蔽，沒有證據顯示它具有獨立意識。</details>
<details><summary>眼部異常</summary>眼睛偶爾出現非自然的環狀紋路，可能與契約及靈魂感知有關，在能力發動時最為明顯。眼睛仍具一般人類的生理特徵，沒有證據顯示能免疫物理傷害。</details>
<details><summary>觸及靈魂</summary>特工如此稱呼自己的能力，可能察覺靈魂與肉體的異常連結、靈魂被撕裂或移除的跡象、外來靈魂附著，以及靈魂活動的痕跡。它不是讀心術，也不能直接辨識所有實體的真實身分。</details>
<details><summary>契約贈禮</summary>據稱 Shade 認為長柄立鐮「很有趣」，因此交給特工。它能斬傷幻影、笑魘等非實體之物；面對實體敵人，一次格擋就可能崩裂。</details>
<details><summary>契約關係評估（5.8）與最後的通訊測試</summary>研究部判斷：特工與白日之影建立了以靈魂為媒介的長期連結；存在能憑此辨識特工的位置或狀態；部分異常能力源自契約；原始姓名已被實體取走。契約能否解除、解除後能否恢復原有狀態，是目前最大的爭議。<br>一次未經安排的通訊測試中，特工對設備問：「${named?'Shade':'█████'}，你還記得我嗎？」約四秒後收到一段回應：「我會。」，聲音與白日之影一致。本事件已封存。</details>
<details><summary>SEC-A03 與 TG-AUD-003 的對照</summary>M.E.G.CN 保存的 SEC-A03（完整度約 78%）中，取暱稱的過程從「Shade，怎麼樣？」開始，之前有一段短暫雜音。它與紀錄 01 是同一事件的不同完整度版本，缺漏處正是「Shadow」那一段。</details>
<details><summary>訪談節錄 TG-INT-01：契約與解除 <span class="stamp in">部分拒答</span></summary>${dlg('研究員','你與它之間存在契約。契約內容是什麼？')}${dlg('特工','嗯，這個啊……商業機密～')}<span class="ann">〔一涉及契約內容便以玩笑轉移，未提供任何可驗證資訊。〕</span>${dlg('研究員','你是否認為自己受到它的控制？')}${dlg('特工','有時候會覺得它知道得太多了。誰喜歡被一直盯著看？')}<p><i>研究部註記：</i>已確認其背部有非一般人體組織的異常標記，受訪者拒絕進一步檢查。<span class="stamp in">拒絕檢查</span></p>${dlg('研究員','包括背部的異常標記？')}${dlg('特工','你們連這個都知道？哇，工作效率不錯嘛。')}${dlg('研究員','你想解除契約嗎？')}${dlg('特工','這題也太直接了吧。……想過。還沒決定。我也想知道它到底在想什麼。')}${dlg('研究員','為什麼是你？')}${dlg('特工','這個問題你可能要去問它。')}${dlg('研究員','你知道它在你身上做了什麼嗎？')}${dlg('特工','知道一部分。')}${dlg('研究員','你對它抱持什麼感覺？')}${dlg('特工','哈哈，你這個問題問得好直接。……這題我跳過。')}<div class="srow"><span class="stamp">拒答</span></div></details>
<details><summary>訪談節錄 TG-INT-01：暱稱與姓名 <span class="stamp in s3">已遮蔽（原名）</span></summary>${iv(`研:為什麼選擇 Shade 這個暱稱？\n特:一開始想叫 Shadow，太長就縮短了。它說名字只是人類稱呼自己的聲音，它不需要。我覺得它只是還不懂名字的意義。\n研:你的原始姓名是否與契約有關？\n特:有。可以說是它拿走的。\n研:你沒有要求歸還？\n特:沒有。現在也還過得去嘛。\n研:你真的不在意？`)}<span class="ann">〔談到原名時語氣轉淡，不再開玩笑，並主動結束提問。〕</span>${dlg('特工','……你們問題問完了嗎？')}</details>
<details><summary>附錄 D：內部通訊 INT-L-616-04</summary>${dlg('研究員 A','我們目前仍然無法確認他的能力來源。')}${dlg('研究員 B','但他顯然知道那個存在。')}${dlg('研究員 A','知道不代表能夠控制。如果那個存在能夠透過他影響我們呢？')}${dlg('研究員 B','那就繼續觀察。至少目前為止，他救過的人比他帶來的麻煩多得多。')}${dlg('研究員 C','那我們應該把他當成什麼？')}${dlg('研究員 B','他仍然是我們的<span class="nm">特工</span>。')}</details>
<details><summary>附錄 E：無人操作的通訊紀錄 REC-L-616-UNKNOWN</summary>M.E.G.CN 通訊設備在無人操作時自行啟動，錄到一個未知聲音：「他今天沒有回來。」短暫停頓。「以前會。」約十秒後：「你們知道他去哪裡了嗎？」設備隨即自行關閉，聲音與白日之影一致。</details>
<div class="card warn">研究部：以上內容不得作為特工與 Shade 完全互信的證據。雙方在人類生命、身體自主、疼痛與姓名的意義上仍有明顯認知差異。任何人不得擅自以特工的名義向 Shade 提出要求。</div>`},
hist:{n:'樓層歷史',l:1,h:()=>`<h2>樓層歷史</h2><div class="meta"><div><i>歷史最高評估</i>Class 5</div><div><i>資料管理單位</i>M.E.G.CN 康幕委員會（最高管理層）</div></div>
<p class="lgd">依時間順序整理。危險機制、傷亡案例與研究部判斷見${L('f1','早期危險評估')}。</p>
<details open><summary>階段一　最初發現</summary><p>最早期的探索紀錄已無法完整追溯。樓層在建立編號之前，就已出現在流浪者的口述中。早期倖存者的描述共通處：進入封閉的空房間、沒有出口指示、離開後進入規則各異的空間、經常在不知情下被迫參與測試，部分房間極度致命且無法中止。</p><p>它曾被稱為「考場」「白色迷宮」「審判室」。「實驗場」一詞最早見於研究部早期的調查紀錄，因最貼近內部運作而被採用。</p></details>
<details><summary>階段二　早期樓層狀態</summary><p>當時規則不穩定：倒數歸零卻無事發生；通過的房間重新出現且結構不同；試煉結束後仍被迫留在原地；出口在參與者死亡後才開啟；空房間裡聽見交談聲。死亡人數不詳，早期資料缺乏統一的紀錄標準；詳細紀錄見${L('f1','早期危險評估')}。</p></details>
<details><summary>階段三　M.E.G.CN 初期調查</summary><p>首批小隊的目標是探明空間結構、分類危險程度、整理規則、尋找穩定出口，並查明是否有智慧實體。多支隊伍失聯，或離開後無法描述房間。早期證詞反覆出現：「房間好像知道我們在做什麼。」「我們還沒決定要不要救他，門就已經開了。」當時被歸為高壓下的主觀感受。</p></details>
<details><summary>階段四　危險程度變化</summary><p>致命機關停止、倒數允許放棄、嚴重傷害前提早中止試煉、需犧牲人員的出口出現其他通過方式。這些變化並非同時發生，也沒有設備可解釋。研究部認為這些變化出自白日之影自身態度的轉變，原因列為機密。</p></details>
<details><summary>階段五　現行狀態</summary><p>現行評估為 Class 1，多數房間不再以致命結果作為完成條件，實驗可在極限處中止（見${L('rules','房間規則')}）。近期發生過一次樓層根基受損的事件，詳細經過列為機密（見${L('inc','根基事件')}）。</p></details>
`},
anom:{n:'特殊物品與特殊狀態',l:1,h:()=>`<h2>特殊物品與特殊狀態</h2><p style="color:var(--mut)">各異常彼此獨立，機制各不相同；其中部分（如 I-02）由白日之影設置。</p>
<details open><summary>I-01 未完成的門</summary>缺少完整門扇與門框的入口，無把手，無法以工具破壞，門框內是無法辨識的空間，並非始終存在。一支四人隊伍中，兩人看得見門框，另外兩人看見的牆面毫無變化。它不是有效出口。</details>
<details><summary>I-02 空白紀錄器</summary>外觀似一般紀錄器，由白日之影設置，只能錄音。探索者離開房間後，部分設備會自動生成不超過十秒的音訊：「他沒有回答。」「這次不一樣。」「還可以繼續。」「已經結束了。」「下一個。」</details>
<details><summary>I-03 停止的計時器</summary>顯示時間與外界不一致：倒數停止但人可正常活動；歸零後無事發生；顯示持續增加的負數；拆除後仍在原處顯示數字；不同人看見不同的時間。</details>
<details><summary>I-04 觀測窗口</summary>普通玻璃窗，另一側是獨立的房間，可看見其他隊伍試煉，對方似乎無法察覺觀測者。部分畫面並非即時：窗內隊伍的動作與數小時前回收的影像完全一致。</details>
<details><summary>I-05 多餘的鑰匙</summary>無法對應任何已知門鎖，不開啟房間內原有的門，但持有期間房間的某些異常會停止活動，可暫時抑制所在房間的異常。</details>
<details><summary>I-06 行為矯正錄音</summary>一組共七段的音訊檔案，格式不明，無建立日期、錄製設備或持有者資訊，僅以 01 至 07 編號。可正常播放，但無法複製到實驗場以外的儲存設備；部分檔案播放結束後會自行重新排列。內容為一名男性與未知實體的對話，音檔收錄於通訊紀錄「I-06 行為矯正錄音」。</details>
<h2 style="margin-top:1.6em">特殊狀態</h2>
<details><summary>S-01 被注視</summary><p class="lgd">感官干涉　觸發：長時間處於具觀察性質的房間，或被未知存在持續注視</p><p><b>症狀</b>：覺得牆上的畫像在注視自己、身後有人移動、物體位置與記憶不同。<b>效果</b>：可能提前察覺異常，也會把正常現象誤判為危險，越來越難分辨真異常與錯覺。<b>解除</b>：離開該房間，並暫停觀察異常物件。</p></details>
<details><summary>S-02 記憶錯位</summary><p class="lgd">認知干涉　觸發：接觸具記憶重組性質的房間或物品</p><p><b>症狀</b>：把隊友的經歷當成自己的，或記得沒發生過的對話。<b>效果</b>：對錯誤記憶高度確信；多人受影響時記憶會互相矛盾。<b>解除</b>：以外部紀錄、通訊設備或未受影響的隊員確認經歷。</p></details>
<details><summary>S-03 角色置換</summary><p class="lgd">身分認知干涉　觸發：參與具身分判定或角色分配規則的實驗</p><p><b>症狀</b>：誤以為自己是領導者、隊友該服從自己，或必須完成別人的任務。<b>效果</b>：堅持執行不屬於自己的任務，對隊友產生陌生感，但不改變性格與價值觀。<b>解除</b>：重新確認姓名、職責與任務分配，或離開該房間。</p></details>
<details><summary>S-04 感官交換</summary><p class="lgd">感官異常　觸發：接觸具感官轉換性質的裝置或房間</p><p><b>症狀</b>：聽見顏色、看見聲音的形狀、把疼痛誤認為溫度變化。<b>效果</b>：有時能發現隱藏線索（例如聲音顯示為裂縫），但不保證資訊正確。<b>解除</b>：離開實驗區域後自行消退。</p></details>
<details><summary>S-05 結果預知</summary><p class="lgd">預知干涉　觸發：接觸具結果預測性質的房間</p><p><b>症狀</b>：推門前看見門後崩塌、聽見隊友尚未說出的話、看見自己倒地。<b>效果</b>：預知未必成真；改變行動可能改變結果，也可能產生新的異常。<b>解除</b>：該房間的實驗結束後消失。</p></details>
`},
exp:{n:'探索紀錄',l:1,i:()=>LOGA.i&&LOGA.i(),h:()=>LOGA.h()+`<h2 style="margin-top:1.6em">一般探索者調查紀錄</h2>
<details open><summary>EX-01 多餘的房間</summary><p class="lgd">房間：重複房間　日期：20xx/██/██　來源：探索者回報<br>人數 3　結果 全員離開　耗時 約 8 小時　傷亡 無</p>連開六扇門，每間都是相同的白色房間，地上沒有腳印。停止開門約二十分鐘後牆面裂開，出現一扇灰色門。房間針對重複行為，停止開門是唯一的通過方式。</details>
<details><summary>EX-02 沒有正確答案的題目</summary><p class="lgd">房間：選擇房間　日期：20xx/██/██　來源：探索者回報<br>人數 4　結果 全員離開　耗時 約 11 小時　傷亡 無</p>螢幕提出 A「協助資源不足的陌生人」與 B「離開並保留資源」。隊伍討論四十分鐘選 A，沒有變化，螢幕問：「為什麼？」二十秒後出口開啟。沒有預設答案。</details>
<details><summary>EX-03 第七十二小時</summary><p class="lgd">房間：限時房間　日期：20xx/██/██　來源：回收影像<br>人數 2　結果 全員離開　耗時 約 3 日　傷亡 一人輕傷</p>生活設備齊全的房間，倒數 72:00:00。倒數剩約三小時時，螢幕關閉，床下出現檢修門。回收影像顯示該門早已存在，但先前影像裡那處地板完整。</details>
<details><summary>EX-04 第三個人</summary><p class="lgd">房間：合作房間　日期：20xx/██/██　來源：回收影像<br>人數 3　結果 2 人離開，1 人失蹤　耗時 約 6 小時　傷亡 1 人失蹤</p>三張椅子，螢幕稱「尚有一位參與者未就座」。一名隊員轉向空牆角與看不見的對象交談，說出「你不是已經坐下了嗎？」，約四十秒後從影像中消失。</details>
<details><summary>EX-05 不需要回答</summary><p class="lgd">房間：觀察房間　日期：20xx/██/██　來源：探索者回報<br>人數 1　結果 成功離開　耗時 約 2 小時　傷亡 無</p>紙上問：「你為什麼來到這裡？」探索者不作答，文字消失後又問：「你不想回答嗎？」他說：「不知道也可以吧。」紙上最後出現「可以。」沉默被視為有效回答。</details>
<details><summary>EX-06 提前結束</summary><p class="lgd">房間：合作房間　日期：20xx/██/██　來源：探索者回報<br>人數 5　結果 全員離開　耗時 約 9 小時　傷亡 無</p>五個操作台，螢幕要求達成共識後同時啟動。討論兩小時無果，一人自行啟動，其餘四台隨即亮起。房間觀察的是人們如何面對他人違反共同決定。</details>
<details><summary>EX-07 兩份相同的答案</summary><p class="lgd">房間：選擇房間　日期：20xx/██/██　來源：探索者回報<br>人數 4　結果 全員離開　耗時 約 5 小時　傷亡 無</p>每人獨立輸入「最值得信任的人」，螢幕顯示的四份答案完全相同，時間戳記一致，而且有人說自己並沒有選那個人。答案沒有被修改，結果由房間統一。</details>
<details><summary>EX-08 不存在的隊友</summary><p class="lgd">房間：記憶與感知房間　日期：20xx/██/██　來源：探索者回報<br>人數 5　結果 全員離開　耗時 約 13 小時　傷亡 無</p>六張椅、六份資料，其中一份屬於名單上沒有的人，卻包含完整姓名與經歷。第六張椅自行後移，文件消失。事後有隊員問：「我們原本是不是有六個人？」</details>
<details><summary>EX-09 不能說謊的房間</summary><p class="lgd">房間：問答房間　日期：20xx/██/██　來源：探索者回報<br>人數 3　結果 全員離開　耗時 約 7 小時　傷亡 無</p>三個問題：是否拋棄過需要幫助的人、是否為自身安全隱瞞資訊、是否認為所有選擇都正確。回答完畢後牆面顯示：「你們不需要說實話。」無任何懲罰。</details>
<details><summary>EX-10 提前停止的試煉</summary><p class="lgd">房間：選擇房間　日期：20xx/██/██　來源：探索者回報<br>人數 2　結果 全員離開　耗時 約 4 小時　傷亡 一人精神受影響</p>兩人無法達成共識，其中一人精神不穩。隊員說「我不想繼續了。」約三秒後有聲音答：「可以。」設備隨即停止，牆面出現出口。這是較早具完整音訊的提前終止案例。</details>
<details><summary>EX-11 不屬於這裡的聲音</summary><p class="lgd">房間：觀察房間　日期：20xx/██/██　來源：探索者回報<br>人數 1　結果 成功離開　耗時 約 10 小時　傷亡 無</p>空白房間，三十分鐘後有聲音問：「你在等什麼？」「為什麼？」「那為什麼不繼續？」探索者答：「因為我不想死在這裡。」長沉默後聲音說：「知道了。」十秒後出口開啟。聲音來自白日之影。</details>
<details><summary>EX-12 沒有完成的第七項試煉</summary><p class="lgd">房間：額外試煉房間　日期：20xx/██/██　來源：探索者回報<br>人數 6　結果 全員離開　耗時 約 18 小時　傷亡 無</p>第六項之後進入白房，紙上寫：「你們已經完成了。」隊伍以為這是第七項，一名隊員說：「那就走吧。」原本不存在的出口隨即出現。不排除樓層依隊伍狀況自行判定試煉結束。</details>`},
appx:{n:'研究附錄',l:2,h:()=>`<h2>研究附錄</h2>
<details open><summary>附錄 A：七項試煉備忘錄</summary>研究部認為試煉並非單純的生存測驗，而是要求參與者在資訊不全下作選擇，評估標準因房間而異。部分研究人員認為樓層記錄的是人類的行為模式，而非道德價值。</details>
<details><summary>附錄 B：實驗中止協議補充</summary>實驗中止協議觸發後，在探索者離開該房間之前，後續傷害受到限制。該協議同樣適用於特殊異常個體，相關事件見根基事件。</details>
<details><summary>附錄 C：關於白日之影的定位</summary>研究部早期曾提出三項假說：樓層管理者、樓層本身產生的意識、外來異常實體。現行結論是：它既不是管理者，也不是單純的樓層意識，而是與樓層共生的獨立個體。目前主要的爭議是，它在樓層之外是否有獨立的本體。</details>
<div class="card">最終研究備註：值得注意的不是房間設備，也不是試煉本身的危險性，而是長期存在於樓層內的白日之影。M.E.G.CN 建議維持觀察、避免主動干涉。所有試煉都由白日之影設計與調整。它清楚自己在做什麼，卻不理解這些試煉對人類造成的傷害。</div><div class="card warn">契約關係評估、通訊測試與保存音檔對照等資料列為高度機密，見${L('fc','契約紀錄')}。</div>`},
inc:{n:'根基事件',l:3,h:()=>`<h2>機密檔案：樓層根基完整度異常事件</h2><div class="meta"><div><i>檔案編號</i>M.E.G.CN-INCIDENT-███</div><div><i>狀態</i>部分解密</div><div><i>相關</i>特工、白日之影</div></div>
<details open><summary>樓層根基與兩種判定</summary>實驗場可能存在維持穩定的核心結構「樓層根基」，位置與外觀未知。持續破壞房間、設備與運作結構時，樓層會出現連鎖異常；為救援受困者而破壞機關，則沒有觀察到造成根基損傷。因此存在兩種機制：<br><b>業力傾向</b>：是否協助他人、傷害其他生命、為自身利益犧牲他人、承擔後果、造成傷害後補救。<br><b>根基完整度</b>：是否破壞核心設備、大規模破壞結構、強行干涉空間連結、非必要地破壞穩定。兩者可能互相影響，算法未知。</details>
<details><summary>崩解事件的處置流程</summary><ol><li><b>召喚</b>：樓層根基遭到嚴重破壞、實驗系統失控時，白日之影會召喚與其有契約關係的特工介入。特工了解它對人類承受能力與傷害程度的認知缺陷，會設法阻止它在失控時進一步擴大破壞。他離隊前的那則通訊，就是對這次召喚的回應。</li><li><b>交涉</b>：特工先詢問流浪者是否願意停止破壞並直接離開（對話見通訊紀錄 12）。</li><li><b>分歧</b>：接受勸離、選擇逃跑，或在戰鬥中被特工制伏的進入者，都會被傳送至 Level 995「因果之地遊樂園」；特工不會因此死亡。</li><li><b>實驗中止</b>：特工遭到重創、已無法繼續行動時，樓層原有的實驗中止協議再度觸發，所有實驗暫停，房間停止崩解。</li><li><b>現身</b>：白日之影親自現身，詢問倒下的特工是否還能繼續（見通訊紀錄 11、12）。</li><li><b>最終階段</b>：若特工無法繼續介入，白日之影將接替其位置，成為最終的敵對目標，直接對仍留在樓層內的流浪者發動攻擊，範圍涵蓋整座樓層。</li><li><b>後續處置</b>：特工不因流浪者過去的錯誤選擇而否定其停止傷害的可能，只要願意停止，即使已造成大量損害，仍給予離開的機會；但傷害不會被抹除，流浪者仍須在 Level 995 面對後果與制裁。若白日之影在最終戰鬥中獲勝，曾對樓層及其他生命造成嚴重傷害者，可能觸發壞結局。</li></ol></details>
<details><summary>事件經過</summary>多名探索者在連續試煉中的異常行為，使多個房間的規則同時失效。特工在離隊前向隊伍發出一則簡短通訊（未收錄於錄音，與 REC-12 的求援無線電是兩次通訊），隨後失聯。約二十分鐘後：牆壁失去結構、房間重疊、重力方向改變、多個出口失效、試煉設備自行運作、出現大量空間裂縫。當時樓層內仍有多支隊伍。</details>
<details><summary>影像 SEC-B02（完整度約 52%，無有效音軌，與 REC-12 對照）</summary>影像 00:00 約對應錄音 01:24。特工手持一件長柄鐮刀，在變形的走廊與數名探索者對峙，多次舉手示意停手，沒有主動揮擊（對應錄音 01:24–03:02 的勸阻）。錄音 03:30 起的碰撞，在影像中是迴避、格擋與限制對方行動，沒有明確的致命意圖。約 03:51 部分人影在畫面中消失，同時錄音出現遠處旋轉木馬般的音樂。04:05 再次碰撞後他倒地，四周設備同時停止（對應 04:19 的靜止）。其後白日之影的聲音由畫外傳入，影像中沒有可辨識的形體。完整對話見通訊紀錄 12。</details>
<details><summary>後續</summary>特工停止行動後，房間停止崩解，部分出口重現。白日之影隨後出現，並接管空間結構，重新排列房間，移除部分房間，將探索者分散到不同空間。傳送對象見「分歧」；留在樓層內的人員由白日之影直接處置，之後的去向列為機密。有倖存者稱在抵達前看見實驗場的房間逐漸消失，也有人聲稱看見持長柄鐮刀的 M.E.G.CN 人員倒在白色房間內；該人員其後已重新出現在人事與任務紀錄中。事件後特工的身體狀況已恢復。</details>`},
ppl:{n:'相關人員紀錄',l:3,h:()=>`<h2>相關人員紀錄</h2><div class="meta"><div><i>對象</i>M.E.G.CN 探員（特工）</div><div><i>用途</i>索引涉及同一名探員的檔案</div></div>
<p>本頁只標示各檔案如何涉及這名探員，以及資料的來源。他是 Level -616 重大事件的重要參與者之一，不是樓層的管理者，也不是樓層唯一的主線。</p>

['09','實驗中止後之行為觀察','特工聯絡對講機　現行規則形成後<br>檔案：REC-██-09　錄製：20xx/██/██ 14:30　時長：02:20<br>來源：特工聯絡對講機　訊號：良好',`n|00:00　走動聲，腳步輕，節奏不均。

['10','規則','特工私人語音備忘錄　未提交<br>檔案：REC-██-10　錄製：20xx/██/██　時間不明　時長：05:26<br>來源：特工聯絡對講機（語音備忘，自錄）　訊號：良好',`n|00:00　錄音開始。特工清了清喉嚨。
a|嗯……備忘錄，好，開始。我先講我自己的，萬一以後忘記。

n|00:58　約6秒無人出聲，日光燈鎮流器的嗡聲持續。

a|第二，它通常會立刻發現，不用我叫。有時候我還沒進去，房間就已經變了。
n|01:30　房間內傳來走動聲。錄音開始出現第二個聲源。

a|來看看你啊。
n|01:44　背景聲音恢復單一。特工繼續說話，但音量降低。

n|02:33　機械運作聲，像是醫療儀器。持續約15秒。
s|你需要修復。
n|02:45　遠處傳來空調機組啟動的低沉運轉聲，持續約兩秒。
a|不用，謝謝。
n|02:58　儀器聲沒有消失，也沒有靠近麥克風。
a|第四，特殊實驗。身體、異常標記、靈魂跟肉體的連結、契約本身、我的記憶、我對別人的態度，還有它對我的觀察。
a|我的狀態到達極限時，不會立刻被送出去，實驗會先中止。接著它就會自己出現。
s|還能繼續嗎？
a|我說不，或者不回答，它就不會強迫。要是我說可以，它可能換內容，也可能讓房間恢復運作。
n|04:12　約9秒的空白，偶爾夾著細小的電流雜訊。特工吞嚥的聲音。
a|第五，通常能自己找到出口。有時它也會直接開門，省得我找。當然，不是每次都這麼方便啦。
n|05:20　特工發出短促的笑聲，隨即停止錄音。
a|……先這樣。剩下的，等下次確認過再補。`],
['11','TG-P-07 特殊實驗中止紀錄','特殊實驗紀錄　已中止<br>檔案：REC-██-11（TG-P-07）　錄製：20xx/██/██　時間不明　時長：03:51（節錄）<br>來源：實驗場固定收音　訊號：不穩定',`n|00:00　空間持續變化、重疊的低鳴聲。金屬摩擦聲，約10秒。

['12','TG-P-12 樓層結構崩解事件通訊紀錄','M.E.G.CN 通訊紀錄　完整<br>檔案：REC-██-12（TG-P-12）　錄製：20xx/██/██　時間不明　時長：07:02<br>來源：特工隨身無線電（開放頻道，總部同步收錄）　訊號：弱，受空間扭曲影響',`n|00:00　空間重疊的低鳴聲壓過無線電底噪，其間夾著混凝土被緩慢拉扯的悶響，反覆錯位。

function loreShow(t){let e=q('#lore');if(!e){e=document.createElement('div');e.id='lore';e.onclick=()=>e.classList.remove('on');document.body.append(e)}
 if(P[cur]&&(P[cur].l==1||!named))t=t.replace(/Shade/g,'白日之影');if(P[cur]&&P[cur].l==1)t=t.replace(/特工/g,'某探員');
 e.textContent=t;const sg=document.createElement('span');sg.className='it';sg.textContent='——整理';e.append(sg);e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),6500)}
function caret(x,y){let n,o;if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(x,y);if(r){n=r.startContainer;o=r.startOffset}}else if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(x,y);if(p){n=p.offsetNode;o=p.offset}}return n&&n.nodeType==3?[n,o]:null}
document.addEventListener('click',e=>{const m=q('#main');if(!m||!m.contains(e.target)||e.target.closest('summary,a,button,input,.fx,#lore'))return;if(String(getSelection()).length)return;const c=caret(e.clientX,e.clientY);if(!c)return;const [n,o]=c,v=n.nodeValue;
 for(const [k,t,min,pgid] of LORE){if(clr<min||(pgid&&pgid!=cur))continue;let i=v.indexOf(k);while(i>=0){if(o>=i&&o<=i+k.length){loreShow(t);return}i=v.indexOf(k,i+1)}}});

function tidy(id){if(!P[id]||P[id].l>clr||!['rules','f1','fc','inc'].includes(id))return;const root=q('#main');if(!root||q('.it.td',root))return;
 const EX='summary,h1,h2,h3,h4,a,button,.q,.meta,.fx,.it,.tools,.rel,.nm,.keep,[data-k],#lore,.stamp,.red';
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
 const put=(a,b,rep)=>{for(const n of ns){if(!n.isConnected)continue;const p=n.parentElement;if(!p||p.closest(EX))continue;const i=n.nodeValue.indexOf(a);if(i<0)continue;const mid=n.splitText(i),aft=mid.splitText(a.length),sp=document.createElement('span');sp.className='it td';sp.textContent=b;if(rep){sp.title='原文：'+a;mid.replaceWith(sp)}else mid.after(sp);ns.splice(ns.indexOf(n)+1,0,aft);return true}return false};
 for(const [a,b,r] of (TD[id]||[]))put(a,b,r);
 if(P[id].l>=3&&!q('p.it.end',root)){const e=document.createElement('p');e.className='it end';e.textContent='放好了。';root.append(e)}}
