<script>
const $=s=>document.querySelector(s);
const STORE_KEY='level616-ui-state-v2';
const readState=()=>{try{const v=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');return v&&typeof v==='object'?v:{}}catch(_){return {}}};
const savedState=readState();
let themePref=['dark','light'].includes(savedState.theme)?savedState.theme:'light';
if(themePref==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=themePref;
const saveState=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify({clr,found,named,theme:themePref}))}catch(_){}};
let clr=[1,2,3].includes(Number(savedState.clr))?Number(savedState.clr):1,found=!!savedState.found,cur='home',named=!!savedState.named||Number(savedState.clr)===3;
const toast=t=>{if(typeof P!=='undefined'&&P[cur]&&(P[cur].l==1||!named))t=t.replace(/Shade/g,'白日之影');if(typeof P!=='undefined'&&P[cur]&&P[cur].l==1&&!['talk','sim'].includes(cur)&&!t.startsWith('筆記本'))t=t.replace(/特工/g,'某探員');const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._timer);toast._timer=setTimeout(()=>e.classList.remove('on'),2800)};

// 暗色主題的注視效果：眼睛會追蹤游標／觸控位置，隨機眨眼
let eyeCanvas=document.createElement('canvas');
eyeCanvas.id='dark-eyes';
eyeCanvas.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40;display:none';
document.body.appendChild(eyeCanvas);
const eyeCtx=eyeCanvas.getContext('2d');
let eyeW=0,eyeH=0,eyeTimer=0,eyes=[],eyeMouse={x:innerWidth/2,y:innerHeight/2};
addEventListener('mousemove',e=>{eyeMouse.x=e.clientX;eyeMouse.y=e.clientY;},{passive:true});
const updateEyeTouch=e=>{if(e.touches&&e.touches[0]){eyeMouse.x=e.touches[0].clientX;eyeMouse.y=e.touches[0].clientY;}};
addEventListener('touchstart',updateEyeTouch,{passive:true});
addEventListener('touchmove',updateEyeTouch,{passive:true});
function resizeEyes(){
  const dpr=Math.min(devicePixelRatio||1,2);
  eyeW=innerWidth;eyeH=innerHeight;
  eyeCanvas.width=Math.round(eyeW*dpr);eyeCanvas.height=Math.round(eyeH*dpr);
  eyeCanvas.style.width=eyeW+'px';eyeCanvas.style.height=eyeH+'px';
  eyeCtx.setTransform(dpr,0,0,dpr,0,0);
  eyes=Array.from({length:7},()=>({x:Math.random()*eyeW,y:Math.random()*eyeH,scale:.75+Math.random()*.65,blinkAt:Math.random()*500}));
}
resizeEyes();
let eyeRaf=0;
const reduceMotion=matchMedia('(prefers-reduced-motion:reduce)');
const eyesOff=()=>!!document.getElementById('intro');
const darkNow=()=>document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);
function paintStaticEyes(){
  eyeCtx.clearRect(0,0,eyeW,eyeH);
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#8c83a8';
  eyeCanvas.style.display='block';eyeCtx.strokeStyle=accent;eyeCtx.globalAlpha=.3;eyeCtx.lineWidth=1.2;
  eyes.forEach(e=>{eyeCtx.beginPath();eyeCtx.ellipse(e.x,e.y,25*e.scale,11*e.scale,0,0,Math.PI*2);eyeCtx.stroke()});
  eyeCtx.globalAlpha=1;
}
function drawDarkEyes(){
  eyeRaf=0;
  if(!darkNow()||document.hidden||eyesOff()){eyeCanvas.style.display='none';eyeCtx.clearRect(0,0,eyeW,eyeH);return;}

home:{n:'樓層概述',l:1,h:()=>`<h2>實驗場（The Testing Ground）</h2>
<div class="meta"><div><i>現行難度</i>Class 1</div><div><i>檔案編號</i>M.E.G.CN-L-616</div><div><i>最後更新</i>20██/11/24</div><div><i>檔案管理單位</i>收音機|通訊部門</div><div><i>環境</i>結構變化不穩</div><div><i>實體</i>1（目前列檔：Shade）</div><div><i>主要異常</i>非線性空間、空間/功能錯置</div><div><i>基地</i>無法維持常設基地</div></div>



<p>Level -616，暫稱「實驗場」，是一處由大量房間、走廊構成的非線性樓層。由於空間異常特性，樓層沒有固定平面圖<sup class="fn">[1]</sup>（見${L('space','空間結構')}）。</p>
<h3>樓層簡述</h3>
<p>進入者通常從白房間出發，再穿過約七個規則各異的空間，即可找到出口。部分空間的外觀與實際用途並不一致（見${L('rules','房間規則')}）。出口多以原本不存在的門出現，且目的地無法預測。實驗場無法維持常設基地，通訊與物資同樣不可靠（見${L('base','基地・出入口')}）。</p>
<p>房間的配置、規則與出口，據推測大多由一個隱密實體（白日之影）設置與調整。它與樓層的根基共生，可能是整座實驗場運作的核心（見${L('shade','實體觀測檔案')}）。早期的實驗場以致命實驗聞名，現行的危險程度已明顯下降，變化過程詳見${L('hist','樓層歷史')}。</p>
<h3>初始房間</h3>
<p>進入者通常出現在一間空曠、乾淨的立方體房間內，邊長約五至六公尺。六個面均為淺色的平整材料，牆面看不出接縫，沒有窗戶、家具或可辨識的光源，照明卻均勻明亮，足以閱讀與行走。牆面不會積留污漬，地板也不會留下持久的腳印。以敲擊與聲波探測牆體、地板與天花板，均未發現空腔結構<sup class="fn">[2]</sup>。</p>
<p>也有部分人員回報其被送往辦公室、住宅、長廊或與自身記憶相關的房間，這類個案的紀錄列為機密（見${L('f2','研究訪談')}、${L('fc','契約與人員紀錄')}）。信息處理部門認為，樓層會依照進入者過往的接觸紀錄安排初始空間。</p>
<p>進入後的最初幾分鐘，探索者普遍感覺自己正在被注視，但現場找不到攝影機、鏡面或其他觀察裝置。有時牆後會傳出一些低語。約六分鐘後，其中一面牆上會出現一扇原本不存在的門，通常位於進入者的右側。</p>

<h3>須知</h3><ul><li>同一扇門不一定通往相同地點。</li><li>不建議以外觀推斷房間用途。</li><li>無法以記號或指針方向推斷返程路線。</li><li>記得隨時確認同伴位置。</li><li>若有任何異常情況發生，或持續聽見不明聲響，應停止探索並立即尋找出口。</li><li>試圖攻擊 Shade是不妥當的行為。</li></ul>
<div class="fnb"><b>註釋</b><ol><li>指南針|地圖繪製部門曾多次以測距儀、標記帶與紙本地圖嘗試繪製樓層地圖，所有測量結果都無法維持一致。</li><li>EX-13 的探索小隊曾逐面敲擊牆壁、地板與天花板。現有工具也無法在牆面留下任何痕跡。</li></ol></div>
`},
space:{n:'空間結構',l:1,h:()=>`<h2>空間結構</h2>
<p>實驗場並非單一建築延伸，而是由許多尺度、用途與物理條件各異的空間拼接而成。房間之間的連接關係似乎能隨時變動，也不遵循一般建築的內外、上下或遠近概念<sup class="fn">[1]</sup>。連接方式不固定之外，空間本身的用途也不必然與外觀相符（見下方「空間功能錯置」）。</p>
<h3>常見空間類型</h3><ul><li><b>生活空間：</b>住宅、廚房等。物品外觀通常正常，但食物、電力與水源不保證可用。</li><li><b>工作空間：</b>辦公室、教室等。常出現標示、文件或設備，部分內容可能是誘導資訊。</li><li><b>過渡空間：</b>長廊、樓梯等。距離、方向與出口數量可能在進入者轉身後改變。</li><li><b>封閉空間：</b>沒有明顯出口，需完成指定任務、等待條件成立才能離開。</li><li><b>異常空間：</b>重力、時間感、聲音傳遞或物體位置不符合常態。</li><li><b>記憶相關空間：</b>目前僅有少數紀錄。房間會出現與進入者經歷相似的物件、場景或聲音。</li></ul>

<h3 id="fd">空間功能錯置</h3>
<p>Level -616 的空間，外觀、原始用途與實際功能不一定一致。科研部門將這項特性稱為「空間功能錯置」，視為實驗場的核心空間特性之一。</p>
<p>這些空間與物件的物理性質並未改變，只是實際上是作為另一種用途。但仍遵循某種內在邏輯。因此，功能錯置不是一般的異常物品集合。</p>
<h4>三種層次</h4>
<ul><li><b>空間用途錯置</b>：房間的外觀與實際用途不同。</li><li><b>建築功能錯置</b>：建築構件的功能轉換。</li><li><b>物件功能錯置</b>：普通物品被賦予其他用途。</li></ul>
<h4>已記錄的功能錯置房間</h4>
<details id="fd-01"><summary><span class="sum-code">FD-01</span>授課廚房</summary><p class="lgd">類型：空間用途錯置</p>外觀是普通的家庭廚房，但所有設備都遵循教室的運作方式；若探索者沒有完成指定的課程內容，出口便不會出現。<br><b>備註</b>：課程內容不會以明確課綱呈現，探索者只能從設備反應與環境變化推測當前要求。</details>
<details id="fd-02"><summary><span class="sum-code">FD-02</span>盥洗室</summary><p class="lgd">類型：空間與物件錯置</p>外觀是普通的公共浴室，但設備的位置決定房間的可通行性，部分門只能在特定物件排列後開啟。<br><b>備註</b>：出口條件與物件排列有關，調整前宜先記錄原始配置，避免失去可供比對的線索。</details>
<details id="fd-03"><summary><span class="sum-code">FD-03</span>住宿檔案室</summary><p class="lgd">類型：空間與物件錯置</p>外觀是普通的臥室，但家具實際負責保存與整理資訊：床鋪代表一份完整紀錄，衣櫃存放尚未分類的資料。<br><b>備註</b>：家具內的資料不一定屬於當前探索者，不應直接將其中內容視為本人的經歷。</details>
<details id="fd-04"><summary><span class="sum-code">FD-04</span>結帳大廳</summary><p class="lgd">類型：空間用途錯置</p>外觀像一座沒有商品的大型超市，結帳櫃台掃描的是探索者攜帶的物品：某些物品會被判定為不存在，某些則會被重複計算。<br><b>備註</b>：結帳前後的物品數量可能不一致；進入前應先清點並記錄攜帶物品，離開時再逐項核對。</details>
<details id="fd-05"><summary><span class="sum-code">FD-05</span>候診室</summary><p class="lgd">類型：物件功能錯置</p>外觀是普通的候診室，叫號機叫到的人才能自由行動，其他人的動作與時間感會被拉得極慢。<br><b>備註</b>：須注意，目前紀錄中，叫號機從未叫出最後一個號碼。曾有探索者讓出自己的號碼，設備短暫停頓後回應「謝謝？」。</details>
<details id="fd-06"><summary><span class="sum-code">FD-06</span>閱覽室</summary><p class="lgd">類型：物件功能錯置</p>外觀是安靜的圖書室，書本是操作介面，翻頁會改變房間的配置。有一本書全是空白，封面要求探索者「記下你的選擇」。<br><b>備註</b>：書寫內容會在數秒內消失；最後一頁通常只留下「可以不寫。」這句提示，是否書寫不被視為強制要求。</details>
<details id="fd-07"><summary><span class="sum-code">FD-07</span>物品記憶清洗室</summary><p class="lgd">類型：空間與物件錯置</p>外觀像自助洗衣店，滾筒似乎能通往其他空間。目前回報顯示，受到影響的可能是操作者對物品的記憶，包括名稱、用途與相關經歷。<br><b>備註</b>：除非有明確必要，否則不建議使用洗衣機。若必須進入，宜先留下物品清單並交由同伴保管。</details>
<details id="fd-08"><summary><span class="sum-code">FD-08</span>播音室</summary><p class="lgd">類型：物件功能錯置</p>外觀是只有麥克風與喇叭的小房間，麥克風收進的聲音會從其他房間的喇叭播出，語氣與原聲一致，內容卻不一定相同。<br><b>備註</b>：廣播內容可能混入來源不明的回應。聽見同伴聲音時，應先核實。</details>
<h3>非線性連接</h3><p>目前較一致的紀錄似乎顯示，實驗場的門主要作為下一個空間的入口，但未必對應固定方向或距離。相同門框、門牌甚至門後的聲音，都不能作為目的地相同的證據。曾有小隊同時進門後被分配到不同房間，彼此仍能聽見對方，卻無法互相接觸。</p>
<p>測距儀、指南針與粉筆記號在此處只能作短時間參考。標記可能消失，或指向不存在的路線。探索紀錄應同時記下房間特徵、門的外觀、同行者與事件順序。</p>
<h3>環境與感受</h3><p>樓層內的照明穩定而均勻，卻找不到任何燈具。部分房間有風聲，沒有通風口。空氣多半無味、乾燥，溫度恆定在微涼的程度。</p>
<h3>時間與距離</h3><p>樓層內的時間流速大致接近外界。但各區域的差異無法預測，不建議以單次測量推算外界經過的時間<sup class="fn">[2]</sup>。</p><div class="fnb"><b>註釋</b><ol><li>曾有小隊以標記帶沿同一條走廊往返三次，每次測得的長度都不相同，最大差距超過二十公尺。</li><li>EX-08 的隊伍離開後核對時間，計時器顯示的 72 小時與外界實際經過的時間略有出入。</li></ol></div>
<div class="card">試試看：走廊會在你回頭時改變。<div class="cor" id="cor" style="width:67%"><span id="cl2">長 40 公尺</span></div><button id="back">回頭看</button> <span id="cd"></span></div>`,i(){let n=0;$('#back').onclick=()=>{n++;const w=20+Math.random()*75;$('#cor').style.width=w+'%';$('#cl2').textContent='長 '+Math.round(w*.6)+' 公尺';$('#cd').textContent=['','入口還在。','入口換成了另一扇門。','你確定你是從這裡來的？','走廊沒有變，或許是你變了。'][Math.min(n,4)]}}},
rules:{n:'房間規則',l:1,h:()=>`<h2>房間規則</h2>
<h3>總則</h3><ul>
<li><b>功能決定規則</b>：房間的規則取決於它實際執行的功能，而不是外觀（見${L('space','空間結構')}「空間功能錯置」）。</li>
<li><b>提示不可全信</b>：規則會以文字、聲音、設施或環境變化呈現（例如計時器、叫號機、門的出現），但不保證完整，也不保證可信；有些房間完全不說明。</li>
<li><b>任務形式</b>：多數房間要求完成指定任務才能前進，例如回答問題、尋找物品、判斷邏輯、操作裝置或與人合作；也有不要求解題的房間（見「行為與關係房間」）。</li>
<li><b>不要破壞</b>：破壞牆面通常無效，大規模破壞更可能危及樓層根基（見${L('shade','實體觀測檔案')}「根基與崩解」）。</li></ul>
<h3>常見房間類型</h3>
<details open><summary>限時房間</summary>房間內設有倒數計時器、沙漏或叫號機，時間單位與外界不一定相同；倒數歸零時，現行房間通常停止裝置或開啟出口，早期則可能改變房間結構（見下方「早期與現行」）。<br><b>應對</b>：先確認計時器是否隨行動改變，再決定是否分工。<br><b>常見失誤</b>：把倒數當成唯一的壓力，忽略房間內的其他線索；故意等待歸零以測試後果。</details>
<details><summary>選擇房間</summary>房間提供兩個以上的選項，選擇會影響出口、房間結構、可用資源或其他進入者的處境，且不一定存在正確答案；有些選項的後果要到後續房間才出現。<br><b>應對</b>：選擇前說出各自的理由，讓同行者能互相核對。<br><b>常見失誤</b>：只計算風險而不討論代價；把沉默當成默認。</details>
<details><summary>合作房間</summary>房間需要兩人以上分持線索、在不同位置操作裝置，或限時協作。聲音可以跨空間傳遞，同伴卻不一定能抵達你所在的位置。<br><b>應對</b>：進入前先約定確認身分的方式，避免把模仿的聲音誤認為隊友。<br><b>常見失誤</b>：只憑聲音判斷同伴位置；在確認完整性之前就分頭行動。</details>
<details><summary>異常房間</summary>房間會出現重力改變、旋轉、地面移動、出口閃避、重複影像或物體錯位。持續低鳴、牆面重疊或視野扭曲，代表結構不穩定。<br><b>應對</b>：停止觸碰裝置，抓住固定物，等待變化出現規律。<br><b>常見失誤</b>：朝出口衝刺；在移動的地面上單獨行動。</details>
<details><summary>觀察房間</summary>房間沒有明確的任務，主要呈現異常現象或來自其他房間的聲音；停留一段時間後，門通常會自行出現。<br><b>應對</b>：記錄現象的順序與時間，保持原地等待。<br><b>常見失誤</b>：把「沒有任務」當成「沒有危險」；觸碰未知物品或追逐聲源。</details>
<details><summary>記憶與感知房間</summary>房間會重現熟悉的場景、人物的聲音或片段的記憶，內容未必可靠，不能作為證詞。<br><b>應對</b>：與同行者各自描述所見，再互相比對。<br><b>常見失誤</b>：看見已離開樓層的人時單獨追隨。</details>
<details><summary>功能錯置房間</summary>房間的外觀、用途與實際功能不一致（成因見${L('space','空間結構')}），通常不說明在做什麼，任務隱含在家具、設備與建築構件的運作中：座位決定通行權限，號碼牌決定誰能移動。需要的往往是重新排列房間或完成某種流程，而不是找鑰匙。<br><b>應對</b>：先觀察，再逐一測試，並記錄每次改變。<br><b>常見失誤</b>：依外觀推斷用途；同時測試多個裝置，無法分辨是哪一個產生了反應。</details>
<details><summary>行為與關係房間（非解謎型）</summary>沒有可解的謎，也不一定有明確任務；目前紀錄包含陪伴、實際勞務、聆聽他人經歷與休息。<ul><li><b>陪伴</b>：不要求行動，只需有人留在房間（見${L('exp','EX-17')}）。</li><li><b>勞務</b>：重複而實際的搬運、整理或修補（見${L('exp','EX-18')}）。</li><li><b>見證</b>：聆聽或記錄與自己無關的經歷（見${L('exp','EX-19')}）。</li><li><b>休息</b>：提供食物與床位，沒有明示任務；不能因此推定所有休息房間都安全（見${L('exp','EX-20')}）。</li></ul><p class="note">以上是依個案整理的暫定分類。單一案例只能支持該次觀察，不足以證明所有同類房間都遵循相同條件。</p></details>
<h3>早期與現行</h3>
<details><summary>早期規則與現行規則</summary><ul><li><b>倒數結束</b>：早期可能直接改變房間結構並造成傷亡；現行通常停止裝置或開啟出口。</li><li><b>出口條件</b>：早期曾有出口僅允許一人通過，或需犧牲人員；現行多數出現其他通過方式。</li><li><b>完成條件</b>：早期部分實驗沒有可辨識的完成條件，或未完整告知；現行多數房間有可理解的任務或可放棄的選項。</li><li><b>提示</b>：早期可能提供互相矛盾的線索；現行仍不保證提示完整可信。</li><li><b>空間功能</b>：早期規則多以文字、聲音或倒數呈現；現行部分房間改以空間與物件本身的功能配置為規則，不一定附任何說明。</li></ul><p class="note">並非所有房間都已更新，現行房間仍保留部分舊結構。</p></details>
<div class="card"><b>實驗中止協議</b>：現行紀錄顯示，部分實驗在探索者的身體或精神狀態瀕臨極限時會停止運作，結構穩定並重新開啟出口。此機制不會治療傷勢，也不抹去已造成的傷害；它不是 M.E.G.CN 設置，無法人為啟動，並非所有房間都已確認具備，不能當作安全保障。切勿為了觸發中止而刻意承受傷害。</div>
<p><button onclick="go('sim')">進入模擬體驗</button></p>`},
shade:{n:'實體觀測檔案',l:1,h:()=>`<h2>白日之影</h2>
<div class="chips"><span class="chip">隱密實體</span><span class="chip">個體</span><span class="chip">樓層共生型異常存在</span></div>
<h4 style="margin:.9em 0 .2em;color:var(--mut);font-size:.85rem">基本資料</h4>
<div class="meta"><div><i>實體名稱</i>白日之影</div><div><i>暱稱</i><span class="keep">${named?'Shade':'█████'}</span></div><div><i>分類</i>隱密實體</div><div><i>存在形式</i>個體</div><div><i>性質</i>樓層共生型異常存在</div></div>
<h4 style="margin:.9em 0 .2em;color:var(--mut);font-size:.85rem">範圍與威脅</h4>
<div class="meta"><div><i>主要活動範圍</i>${L('home','Level -616')}</div><div><i>其他區域</i>曾有透過陰影顯現及通訊設備干涉的紀錄；實際活動範圍與能力限制尚未確認</div><div><i>威脅評估</i>尚未正式評估</div><div><i>日常觀測</i>通常不主動攻擊一般流浪者</div><div><i>特殊情況</i>根基遭受嚴重破壞時，可能出現大規模敵對行為</div></div>
<div class="chips toc"><a href="#" class="chip" data-j="sh-desc">概述與形態</a><a href="#" class="chip" data-j="sh-abil">能力</a><a href="#" class="chip" data-j="sh-limit">限制、代價與選擇</a><a href="#" class="chip" data-j="sh-beh">行為與應對</a><a href="#" class="chip" data-j="sh-event">根基與崩解</a><a href="#" class="chip" data-j="sh-disc">發現與研究</a><a href="#" class="chip" data-j="sh-apx">觀測紀錄</a><a href="#" class="chip" data-j="sh-files">相關檔案</a></div>

<details id="sh-desc" open><summary><b>概述與形態</b></summary><ul>
<li><b>定位</b>：白日之影是與 Level -616 共生的隱密實體，也是這座實驗場的運作核心：樓層的空間結構、規則與根基都與它直接相連，樓層的運作與它的存在狀態互相影響。</li>
<li><b>互動方式</b>：它通常不以完整形體直接現身，而是透過空間變化、環境異常、通訊設備及其他可利用的媒介與外界互動。必要時，也能藉由環境中的陰影顯現自身。Level -616 內實驗室般的房間、特殊規則與異常現象（見${L('space','空間結構')}、${L('rules','房間規則')}），都由它設置與調整。</li>
<li><b>研究興趣</b>：它對人類在不同環境、心理壓力及特殊情境下的反應有強烈的觀察與研究興趣，並依受試者的行為調整實驗。</li>
<li><b>主要爭議</b>（關於實體本身）：它在樓層之外是否還有獨立的本體。</li></ul>
<p><b>形態與生理</b></p><ul>
<li><b>平時形態</b>：通常呈現為無固定輪廓的黑色陰影，近似一團流動的暗色物質。</li>
<li><b>交流時形態</b>：聚合成近似人形的輪廓，五官與肢體不穩定、難以辨識。</li>
<li><b>聲音</b>：並非由發聲器官產生。</li>
<li><b>內部結構</b>：目前尚未發現器官、骨骼或循環系統的證據，也尚未取得可供分析的實體組織。</li></ul></details>

<details id="sh-abil" open><summary><b>能力</b></summary>
<p>以下依現有紀錄整理可能涉及白日之影的異常表現。部分事件只有間接證據，尚不能排除樓層本身或其他未知因素的影響。</p>
<ul>
<li><b>空間干涉</b><span class="tg">Level -616</span>：房間連接、通道位置與出口狀態曾出現非自然變化。研究部推測，白日之影可能對其中部分變化具有影響力；是否能自由調整所有空間，仍無法確認。</li>
<li><b>環境調整</b><span class="tg">Level -616</span>：部分設備曾在無人操作時啟動、停止或改變運作方式。這些現象可能與白日之影有關，但目前無法確認它能控制哪些設備，或能否同時處理多個區域。</li>
<li><b>遠距察覺</b><span class="tg">範圍未明</span>：有些事件中，樓層似乎對探索者未公開的行為或對話作出回應。這可能表示白日之影能透過空間察覺活動，但觀測範圍與資訊完整度尚不清楚。</li>
<li><b>陰影顯現</b><span class="tg">零星跨區域紀錄</span>：曾有紀錄描述黑色形體出現在不同位置的陰影中。陰影可能是它顯現的媒介，但尚無證據顯示照片或錄影也能觸發相同現象，更不能據此認定它能任意傳送。</li>
<li><b>通訊干涉</b><span class="tg">設備媒介</span>：部分無線電與對講機曾收到來源不明的訊號，其中少數內容可能與白日之影有關。它是否能主動選擇訊號對象，或只是影響既有通訊，仍待確認。</li>
<li><b>資訊接觸</b><span class="tg">網路媒介・未證實</span>：少數跡象似乎顯示，它可能接觸過後室相關論壇的公開資訊；資料取得方式、範圍與時效都不明。</li>
<li><b>聲音模仿</b><span class="tg">範圍未明</span>：曾有探索者聽見與熟悉人物相似的聲音從非預期位置傳來。尚不能確認這些聲音是否都由白日之影發出，也沒有證據顯示它能複製對象的記憶或人格。</li>
<li><b>形態變化</b><span class="tg">觀測有限</span>：目前描述多為無固定輪廓的黑色陰影，少數紀錄提及近似人形的輪廓；這是否為同一實體的不同狀態，仍未經確認。</li>
<li><b>靈魂干涉</b><span class="tg">高風險・條件未明</span>：少數機密紀錄提及非生理性的痛苦與身心連結異常。研究部懷疑這可能與白日之影及特定關係有關，但形成條件、作用方式與可逆程度都尚未釐清；目前不宜推定它能對一般探索者任意施展。</li>
</ul>
</details>

<details id="sh-limit"><summary><b>限制、代價與選擇</b></summary>
<h4>已知限制</h4>
<ul>
<li><b>範圍</b>：目前確認的能力主要集中在 Level -616 內；樓層外只有陰影顯現與通訊干涉的零星紀錄。</li>
<li><b>對人類</b>：無法複製對象的記憶、人格或思考方式，也無法直接讀取想法。</li>
<li><b>對結果</b>：無法抹去已造成的傷害。</li>
<li><b>依賴媒介</b>：通訊干涉與資訊觀測需要既有的設備或網路；沒有媒介，就無法傳訊或取得資訊。</li>
<li><b>多區域控制</b>：同時維持多個複雜房間時，個別區域的回應可能延遲或不完整。</li>
</ul>
<h4>與樓層的連動</h4>
<p>控制力與樓層根基的完整度似乎有所連動；根基受損時，它對樓層的控制可能下降，嚴重時也可能影響它自身的存在狀態。這項關係仍以研究部觀察與推測為主。</p>
<h4>理解與選擇</h4>
<p>它似乎尚未理解人類為空間與物件賦予的用途（見${L('space','空間結構')}）、名字對個人的意義，以及疼痛為何需要被在意。</p>
<p>探索者表示「我不想繼續了」時，它會停止（見${L('exp','EX-03')}）；對方拒絕回答時，它不再強迫（見${L('exp','EX-11')}）；隊伍判斷試煉已完成時，它會開啟出口（見${L('exp','EX-06')}）。早期紀錄則顯示，它曾在對象明確拒絕時繼續實驗（見${L('f1','早期危險評估')}）。目前的停止行為已較為穩定，但尚不能據此認定它已理解人類的情感與社會規則。</p>
</details>

<details id="sh-beh" open><summary><b>行為與應對</b></summary>
<ul>
<li><b>風險</b>：認知落差造成的傷害風險，見「限制、代價與選擇」。</li>
<li><b>日常行為</b>：白日之影通常不主動攻擊一般流浪者。日常行為是觀察、設置實驗環境，並依受試者的反應調整房間。它的好奇或友善不是安全保證。</li>
<li><b>攻擊方式</b>：沒有固定的直接攻擊手段。主要威脅來自對樓層環境的控制：改變房間規則、封閉出口，或使受試者暴露於異常現象之中。樓層根基受到嚴重威脅時，它的行為模式會改變（見「根基與崩解」）。</li></ul>
<p><b>遭遇時的應對方式</b></p><ul>
<li><b>平時</b>：避免刻意挑釁，或試圖破壞實驗設施。</li>
<li><b>規則改變</b>：房間規則改變時，先確認當前環境與出口狀態（見${L('rules','房間規則')}、${L('base','基地・出入口')}）。</li>
<li><b>精神干擾</b>：出現明顯的精神干擾或感官異常時，盡快離開當前實驗區域。</li>
<li><b>大規模崩解</b>：樓層開始大規模崩解時，立即停止破壞行動，並尋找撤離途徑。</li>
<li><b>它親自現身</b>：若白日之影親自現身並開始攻擊，優先尋找撤離機會，不建議正面交戰；物理攻擊對其無效，且可能被視為敵意。</li>
<li><b>遇見探員</b>：若遇見自稱 M.E.G.CN 探員、正在處理樓層異常的人，請配合其引導，不要介入他與實體的交涉。他並非樓層管理者，也無法控制該實體。</li></ul></details>

<details id="sh-event"><summary><b>根基與崩解</b></summary>
<p><b>根基</b>：研究人員推測，樓層根基與它的存在維持機制有關。根基受損與它的控制力下降有關（見「與樓層的連動」）。目前沒有足夠證據確認其後果，尚無法判定根基完全崩解是否會導致實體消亡；它會優先保護根基。</p>
<p><b>崩解</b>：樓層根基遭到嚴重破壞時，實驗房間會逐漸崩解，原有規則失去穩定，樓層內尚未離開的人將面臨危險，白日之影的行為模式也會隨之改變。具體經過與處置列為機密，見${L('inc','根基事件')}；也可在${L('sim','模擬體驗')}中親身經歷。</p></details>

<details id="sh-disc"><summary><b>發現與研究</b></summary>
<p><b>發現</b>：早期紀錄中，白日之影與 Level -616 的異常現象幾乎同時被記載；兩者最初的先後關係仍不清楚。早期探索隊伍多次回報樓層內有持續觀察他們的存在（見${L('exp','探索紀錄')}）。後續紀錄顯示，它似乎能以直接語言交流；M.E.G.CN 因而將其編入隱密實體檔案。更早期的接觸經過與相關人員的資料列為機密。</p>
<p><b>特殊關係</b>：現有機密檔案似乎顯示，白日之影與一名 M.E.G.CN 探員之間有長期且特殊的往來（見${L('fc','契約與人員紀錄')}）。目前沒有足夠資料顯示該探員能管理或控制樓層；研究部推測，樓層規則可能與白日之影及樓層根基有關。</p>
<p><b>研究備註</b>：研究部觀察到，白日之影似乎在疼痛、傷害、同意與個人身份等概念上，與人類理解存在落差（見「限制、代價與選擇」）。它曾表現出保護特定人類的意願，但它所理解的善意，與人類所認定的並不相同。若研究部關於它與樓層共生的推測成立，破壞樓層根基的行為可能也會影響它本身。</p></details>

<details id="sh-view"><summary><b>各方觀點</b></summary>

<h4>研究員</h4>
<blockquote><b>R-03（行為組）</b>：「它似乎更在意人類如何作出決定。${L('exp','EX-11')}與${L('exp','EX-03')}之後，我們已經很難把沉默與拒絕當成失敗。」</blockquote>
<blockquote><b>R-07（空間組）</b>：「功能錯置可能只是把『用途』當成可調整的參數。根基受損後，房間配置似乎也會變得遲鈍；但這兩者是否直接相關，還不能確定。」</blockquote>

<h4>探員</h4>
<blockquote><b>A-22（救援小隊）</b>：「進去前有人說它通常不主動攻擊，但那種被看著的感覺很差。後來我發現，只要停下來認真看房間，那種感覺就會輕一些。我不確定這是不是錯覺。」</blockquote>
<h4>流浪者</h4>
<blockquote><b>W-01</b>：「它問我為什麼不走，我說我在等同伴。然後多了一扇門。我到現在還不知道該不該謝謝它。」（見${L('exp','EX-15')}）</blockquote>
<blockquote><b>W-02</b>：「有些房間很殘忍，有些房間又溫柔得奇怪。我分不清到底是不是同一個東西做的。」</blockquote>
<blockquote><b>W-03</b>：「以前倒數歸零，我朋友沒有出來。現在大家都說它變了。如果它變了，那以前的呢？」</blockquote>
</details>

<details id="sh-apx"><summary><b>觀測紀錄</b></summary>
<p><b>補充觀測</b>：有流浪者完成任務後聽見「完成了。」，迷路時看見一扇原本不存在的門並聽見「這邊。」；亦有人聽過「結束了。」。這些都是它對流浪者的簡短回應。</p>
<p><b>特殊觀測紀錄 O-01～O-03</b></p>

<ul><li><b>O-01</b>（20██/02/25・今年度）：一名探索者獨自等待出口，向空房間問：「有人在嗎？」約十秒後，擴音設備回答：「有。」他再問對方是誰，設備不再發聲。</li>
<li><b>O-02</b>（20██/06/08・今年度）：試煉結束後，封閉的牆面出現一扇門，門後只有無法辨識的黑暗。隊伍沒有進入，約三分鐘後門自行關閉。</li>
<li><b>O-03</b>（20██/08/12・今年度）：某隊完成試煉後，牆面出現新文字：「你們剛才為什麼沒有告訴他？」該隊確實發生過資訊隱瞞，但未曾在房間內公開討論。</li></ul>
<p><b>接觸紀錄索引</b>：除上述 O-01～O-03 外，下列聲音或文字也出自白日之影：</p>
<ul><li>I-02 空白紀錄器：離開房間後自動生成的十秒內音訊</li><li>EX-04：螢幕追問「為什麼？」</li><li>EX-11：紙上寫下「可以。」</li><li>EX-12：牆面「你們不需要說實話。」</li><li>EX-03：「可以。」</li><li>EX-07：「知道了。」</li><li>EX-06：紙上「你們已經完成了。」</li></ul>
<p><b>回應的共同特徵</b>：簡短、直接，沒有寒暄，似乎不熟悉人類的日常社交與隱含意義。常在人出現決策、沉默、放棄或求助的時刻發聲，回應之後多半伴隨出口開啟或規則停止。</p></details>

<details id="sh-files"><summary><b>相關檔案</b></summary>
<div class="apx"><div><b>檔案 1</b>　非公開音訊——人類行為指導紀錄<br>${L('rec','I-06 行為矯正錄音','I-06/01')}・${L('rec','通訊紀錄 02','02')}・${L('rec','通訊紀錄 P-02','P-02')}</div><div><b>檔案 2</b>　Level -616 實驗環境與異常現象紀錄<br>${L('space','空間結構')}・${L('rules','房間規則')}・${L('anom','特殊物品與特殊狀態')}・${L('exp','探索紀錄')}</div><div><b>檔案 3</b>　特殊事件紀錄——Level -616 根基崩解與實體介入<br>${L('inc','根基事件')}・${L('rec','通訊紀錄 09','09')}・${L('sim','模擬體驗')}・${L('hist','樓層歷史')}</div></div></details>
<div class="card">歸檔備註：白日之影是組織的稱呼，並非它的名字。有人替它取過另一個。</div>`},
base:{n:'基地・出入口',l:1,h:()=>`<h2>基地與出入口</h2><p>實驗場無法建立常設基地。房間與走廊的連接關係會自行改變，已確認的路線無法長期維持；物資存放處可能在無預警時被隔離、移位，或失去通往原區域的路徑。M.E.G.CN 曾多次在樓層內設置補給點與通訊中繼，均在數日內失效，目前僅保留少量可供短暫休整與聯絡的標記點，且不保證每次進入時都能找到<sup class="fn">[1]</sup>。</p>
<h3>入口</h3><ul><li>部分探索者曾由沒有門把、表面平整的純白色門進入；門後是否連接 Level -616，似乎並不固定。</li><li>在空白房間內持續注視沒有接縫的牆面，等待門扉出現。不要敲擊或破壞牆面。</li><li>少數情況下，可能意外穿過不穩定的空間裂縫。裂縫位置與出現條件無法預測，不建議刻意尋找。</li></ul>
<h3>偶發入口</h3>
<p>通往 Level -616 的異常通道並不侷限於特定樓層。這類通道持續時間短，出現位置與條件難以重現，目前回報仍屬零星，也沒有證據顯示它們出自同一來源；下列為較常見的形式。</p>
<ul>
<li><b>門後空間錯位</b>：原本通往普通房間、儲藏室或樓梯間的門，短暫連接至陌生的白色空間；進入後，原門可能消失或恢復原狀。</li>
<li><b>電梯異常停靠</b>：電梯可能在沒有樓層顯示、樓層數字跳動，或抵達不存在的樓層時開門；少數回報稱門外空間與 Level -616 的初始區域相似。</li>
<li><b>樓梯平台偏移</b>：上下樓時，某一平台可能短暫延伸出不符合原建築結構的走廊；回頭或再次踏上階梯後，通道可能消失。</li>
<li><b>維修通道與窄門</b>：牆面檢修口、管線間或原本封閉的窄門，偶爾可能通往不明房間；入口尺寸與內部空間有時不成比例。</li>
<li><b>短暫環境重疊</b>：少數報告提及，走廊燈光閃爍、短暫停電或背景聲中斷後，周遭環境似乎被另一處空間取代；這類事件的持續時間通常很短。</li>
</ul>
<p>上述現象僅代表零星回報，不代表每個樓層都有固定入口或能穩定重現。若遇到疑似通道，不建議為了確認目的地而單獨進入；應先記錄原位置、同行人數與環境特徵。</p>
<p><b>已知入口</b>：Level 0 的長廊中，與牆面顏色不同、無把手的白色門；Level 1 倉庫區一間空無貨架的白色房間，入內後原入口消失；Level 11 無法正常使用的電梯，只有一個按鈕，樓層顯示器不出現任何數字，停止後通往初始房間。這些入口並非隨時存在。</p>
<h3>出口</h3><p>出口多以原本不存在的門扉出現，通常在房間任務完成、等待條件成立，或實驗中止協議啟動之後。門後可能通往相對安全的區域，也可能連接至其他異常樓層，目的地無法事先選擇。</p><p><b>常規出口</b>：多數探索紀錄顯示，完成約七個房間後可獲得離開資格。七是依個案整理出的常見數量，並非固定門檻，實際數量與順序因人員與房間而異，也有未滿七個便離開的案例（見${L('exp','EX-06')}）。</p><p>Level 995「因果之地遊樂園」僅在樓層崩解事件中作為進入者被傳送的去處，詳見${L('inc','根基事件')}。</p>
<h3>導航與物資</h3><p>探索小隊應採取短距離移動、定時回報與同行者互相確認的方式。每次通過門扉前，記下門的顏色、材質、周圍物件與同行人數；若隊伍分散，不要只憑聲音追人。建議攜帶飲水、簡易醫療用品、可靠的照明與可獨立記錄時間的設備，但不得假設物品能跨房間取回。</p>
<h3>通訊限制</h3><p>無線電在部分區域可正常使用，在空間扭曲或房間分離時則可能只能單向發送。收不到回覆不代表總部沒有收到訊息；同樣地，聽見回覆也不代表訊號來自真正的總部。應預先約定失聯後的撤離原則，不要在樓層內無限期等待支援。</p>
`},
sim:{n:'模擬體驗',l:1,h:()=>`<h2>實驗場模擬</h2><p>這是一段以新進入者視角呈現的 Level -616 互動模擬，情境與結果僅供體驗。</p>
<div>身體 <span class="bar" id="hp"><i style="width:100%"></i></span><span id="hv" hidden>10</span>　精神 <span class="bar"><i id="si" style="width:100%"></i></span><span id="sv" hidden>10</span></div>
<div id="room" class="card"></div><div id="ch"></div>`,i:sim},
talk:{n:'非正式交流',l:1,hid:1,h:()=>`<h2>對 ${named?'Shade':'白日之影'} 說話</h2><p style="color:var(--mut);font-size:.9rem">它認識${clr>=2?'特工':'某位探員'}。對其他進入者，它只做觀察與紀錄。</p><div id="chat"><p class="sh">${named?'Shade':'白日之影'}：你好。這是${clr>=2?'特工':'某位探員'}教我的問候方式。</p></div><p><input id="say" placeholder="說點什麼，按 Enter 或送出"></p><p><button id="sendb">送出</button></p>`,i:talk},
f1:{n:'早期危險評估',l:2,h:()=>`<h2>早期危險評估</h2><div class="meta"><div><i>原始難度</i>Class 5</div><div><i>權限</i>高級研究人員</div></div>
<div class="card warn"><b>風險摘要</b>　早期實驗場以致命實驗為常態：房間可造成永久傷害或死亡，規則不事先告知，出口不保證在任務完成前出現。現行難度經評估降為 Class 1，不代表下述情形已確認解決。</div>
<details open><summary>樓層規則的轉變</summary><p>其後規則逐步放寬（原因與一名探員和 Shade 的長期接觸有關，見${L('fc','契約與人員紀錄')}；變化經過見${L('hist','樓層歷史')}階段四）。轉變並非一次完成，現行環境仍保留早期結構與未明異常。不能因近期傷亡下降，就推定舊機制已失效。</p></details>
<details open><summary>已確認的致命風險</summary><ul>
<li><b>死亡條件不告知</b>：部分房間沒有可辨識的完成條件，倒數可能先於任何說明開始；出口有時在進入者放棄之後才出現。</li>
<li><b>出口限額</b>：曾有六人探索隊進入某房間，出口僅容一人通過，無其他出口，也無可破壞的牆面；倒數結束後房間縮小，最終只有一人離開。</li>
<li><b>環境致死</b>：72 小時倒數的房間，時間歸零後氧氣迅速下降，所有進入者均未能離開（現行同類房間見 EX-08，結果不同，不可援引為安全依據）。</li>
<li><b>強行破壞無效</b>：炸藥與槍械均未能解除異常；被破壞的空間或立即恢復，或轉移為另一種結構。</li>
<li><b>靈魂層面傷害</b>：有報告指靈魂受到直接拉扯或撕裂，肉體完整，但與靈魂的連結異常。一般醫療檢查無法判定。</li>
<li><b>累積傷害</b>：失敗不一定立即死亡，但後續房間的難度會增加。</li>
<li><b>連續與失聯</b>：有人被迫連續參與多次實驗；也有小隊失聯，只在其他樓層找到遺物。</li>
</ul></details>
<div class="card warn"><b>評估</b>　早期行為顯示，白日之影似乎不懂生命與死亡的意義。這項判準造成大量傷亡。它對人類的興趣包含情緒、選擇與社會關係，但其做法完全不符合人類的實驗倫理。<br>在可替代的證據出現前，應按早期危險等級假設舊機制仍可能啟動。</div>`},
f2:{n:'研究訪談',l:2,h:()=>`<h2>訪談紀錄</h2><div class="meta"><div><i>文件編號</i>TG-INT-01</div><div><i>地點</i>M.E.G.CN 臨時研究站（補問於臨時醫療站）</div><div><i>目的</i>確認歷史狀態與實體關係</div><div><i>訪談日期</i>20██/09/21、20██/09/28（補問；今年度・序 14、15）　共兩次</div><div><i>訪談人員</i>研究部 ██████（兩名）</div><div><i>文件狀態</i>逐字轉寫・部分刪減</div></div>
<div class="stamps"><span class="stamp">機密</span><span class="stamp s2">研究部存檔</span><span class="stamp s3">部分刪減</span><span class="stamp s2">已核對轉寫</span></div>
<details open><summary>第一次進入 <span class="stamp in s2">轉寫完成</span></summary>${dlg('研究員','你第一次進去的時候，樓層就是現在這個樣子嗎？')}${dlg('特工','不是。一開始的房間倒是差不多，讓人以為這裡還沒裝潢完。然後門一開，裡面就完全不是那麼回事了。')}${dlg('特工','限時、二選一、合作、逃生，什麼都有。像是明明走了十分鐘，回頭卻發現自己還站在原地，那還算是比較簡單的。')}</details>
<details><summary>致命實驗</summary>${iv(`研:你是否曾在樓層裡遭遇致命性的實驗？\n特:有，不只一次。有些房間會讓人搞不清楚該做什麼，倒數就先開始了。\n研:如果選錯了？\n特:看房間。有的只是受傷，有的就沒那麼幸運了。\n研:你能接受其他人遭受這種結果嗎？\n特:接受？很難吧。怎麼可能束手旁觀。`)}${`<span class="ann">〔話題轉到傷亡時笑意明顯收斂，此題回答直接，不帶玩笑。〕</span>`}${iv(`研:即使會影響你自己的生存機率？\n特:要是每次都先算機率，我大概早就不在這裡了。`)}</details>
<details><summary>關於 Shade</summary>${iv(`研:你與它是什麼關係？\n特:關係？朋友吧。不然要怎麼說？`)}${`<span class="ann">〔對「關係」一題以反問與笑聲緩衝，未給出任何定義。〕</span>`}${iv(`研:你認為它具有敵意嗎？\n特:比較難說，因為它不太懂人類。它知道一個人在害怕、在受傷，卻不一定知道那代表什麼。\n研:它為什麼進行那些實驗？\n特:大概是它想更了解人類是什麼吧。\n研:包括你？\n特:尤其是我吧。\n研:為什麼是你？\n特:……這個，下一題吧。`)}<span class="ann">〔停頓約五秒，未回答，要求換題。〕</span>${dlg('特工','它像是從來沒有人教過它怎麼跟別人相處。')}${dlg('研究員','所以你把它當成還在學習怎麼與人相處的對象？')}${dlg('特工','它很危險，這點我沒有否認。不過危險和不懂事，其實可以同時成立。')}</details>
<details><summary>研究部側寫：實體的對話特徵 <span class="stamp in s2">側寫</span></summary><p>初次接觸的錄音見通訊紀錄 01。實體的對話特徵見${L('shade','實體觀測檔案')}「回應的共同特徵」。後續片段中它向特工詢問大量問題：人類為什麼會在恐懼時發笑、為什麼會幫助陌生人、為什麼會對沒有實際用途的事物感興趣、為什麼在明知可能失敗時繼續嘗試、為什麼需要名字。它對恐懼、同情與好奇有自己的理解方式，但與人類的情緒並不相同。</p></details>
<details><summary>實驗與解剖</summary>${iv(`研:它是否曾提出要解剖你？\n特:提過。我沒同意啦。它說：「可是我會讓你活著。」\n研:你如何阻止它？\n特:跟它說不行。以前要說很多次，現在它聽得進去了。`)}</details>
<details><summary>能力與物理攻擊</summary>${dlg('特工','空間那邊比較好懂：牆不見、走廊變長、出口跑到另一邊，它也能直接把人搬去別的地方。靈魂那邊碰到的是更裡面的東西，不是被刀劃到的感覺。')}${dlg('特工','物理攻擊的話，就像打空氣。刀子穿過去，它連躲都不用躲。')}${dlg('研究員','你認為它能被殺死嗎？')}${dlg('特工','不知道。我也沒打算試。')}${dlg('研究員','你的鐮刀呢？')}${dlg('特工','這個我就不回答了，好嗎？我還想繼續跟它做朋友。')}</details>
<details><summary>樓層為什麼改變</summary>${dlg('研究員','你認為樓層為什麼變得安全了？')}${dlg('特工','因為我跟它談過，談了很久。談了什麼嘛，暫時保密。我只能說，它還是會觀察，只是現在大部分人都能平安離開，不用再有人受傷或死掉才算結束。')}<span class="ann">〔特工笑了一下，視線移向別處，沒有說明談話內容。〕</span>${dlg('研究員','它有持續遵守這個改變嗎？')}${dlg('特工','我相信它記得。它現在比較會先問了，只是時機常常不太對。至少現在，它會讓其他人離開。')}${dlg('研究員','記得和遵守不是同一件事。')}${dlg('特工','嗯，我知道。它有時候還是會做很奇怪的事，像是把我弄得半死不活，然後問我還能不能繼續。')}${dlg('特工','它會不會放我走？大部分時候吧。這裡又不是觀光景點。')}</details>
<details><summary>契約與個人資料 <span class="stamp in">已刪減</span><span class="stamp in s3">機密</span></summary><p>此部分問答涉及契約與個人資料，列為高度機密，不在本檔案收錄，節錄見${L('fc','契約與人員紀錄')}。</p></details>
<details><summary>如果它再開始實驗</summary>${dlg('研究員','你會怎麼做？')}${dlg('特工','我會回去。總得有人跟它說不行吧。')}${dlg('研究員','你不認為 M.E.G.CN 可以處理？')}${dlg('特工','可以啊。不過你們得先找到一個能跟它好好說話的人，那比較難。')}</details>
<div class="card">研究部建議：不得強制檢查、不得要求以武力測試 Shade、不得將受訪者視為唯一接觸手段；大規模異常時先通知他，而非派武裝小隊。</div><div class="srow"><span class="stamp s2">已核閱</span><span class="stamp s3">結束訪談</span></div>`},
fc:{n:'契約與人員紀錄',l:3,h:()=>`<h2>機密檔案：契約與相關人員紀錄</h2><div class="meta"><div><i>文件等級</i>高度機密</div><div><i>資料來源</i>特工口述、異常痕跡、未公開紀錄</div><div><i>契約成立</i>20██/04/16（前年度；對應${L('rec','通訊紀錄 05','05')}）</div></div>
<div class="chips toc"><a href="#" class="chip" data-j="fc-sum">契約概要</a><a href="#" class="chip" data-j="fc-ppl">相關人員紀錄</a><a href="#" class="chip" data-j="fc-body">契約與身體異化</a><a href="#" class="chip" data-j="fc-eval">研究部評估</a><a href="#" class="chip" data-j="fc-int">訪談與補問</a><a href="#" class="chip" data-j="fc-app">音訊對照與附錄</a></div>
<div class="card"><b>機密事件先後表</b><ol class="tl"><li>契約成立前　初次接觸（${L('rec','通訊紀錄 01','01')}）</li><li>前年度 04/16　契約成立（${L('rec','通訊紀錄 05','05')}）</li><li>前年度 04/18　TG-P-07 特殊實驗中止；裝置停止、出口開啟後，白日之影詢問特工是否願意繼續，特工首次在正式錄音中明確拒絕恢復實驗（${L('rec','通訊紀錄 06','06')}）</li><li>前年度 05/09　取暱稱的過程（${L('rec','通訊紀錄 P-01','P-01')}；錄製時刻不明）</li><li>前年度 10–11 月起　規則放寬的早期跡象（${L('hist','樓層歷史')}階段四）</li><li>今年度 09/12　根基事件（${L('inc','根基事件')}）</li><li>今年度 09/21、09/28　研究訪談與補問（${L('f2','研究訪談')}）</li><li>歸檔後　未歸檔資料 U-005（下方附錄 D）</li></ol></div>
<h3 id="fc-sum">契約概要</h3>
<p>特工於 Level -616「實驗場」與白日之影建立契約。REC-05 的錄音顯示，白日之影當時承諾：「在我的層級，在我看得到的地方，不會再有人死在我的實驗裡。」另有契約痕跡顯示，特工須持續接受實體觀察；但此條件並未完整收錄於 REC-05 本段錄音，其具體形成方式仍有待確認。REC-05 明確記錄的是白日之影對實驗死亡的自我約束承諾，並未表示所有傷害都會停止；後續行為改善與契約條件是否完全相同，仍應分開判讀。</p>
<p>契約成立後，雙方均受到異常影響（特工身上的變化見下方「契約與身體異化」）；此外，實體似乎能在特定情況下干涉其周遭環境，曾多次出現出口異常生成、陷阱失效及致命攻擊偏移等紀錄。</p>
<p>另有一項未經特工事前同意的契約變更：實體取走其原始姓名。</p>
<p>目前所有可查證的個人紀錄中，該姓名均已無法辨識，統一顯示為「□□□」。實體似乎以此作為辨識及追蹤契約對象的方式，並不理解姓名對人類身分認同的意義。</p>
<p>特工後續為該實體取了暱稱「Shade」。</p>
<h3 id="fc-ppl">相關人員紀錄</h3><p>以下標示各檔案如何涉及這名探員，以及資料的來源。他是 Level -616 重大事件的重要參與者之一，不是樓層的管理者，也不是樓層唯一的主線。</p>
<details><summary>相關檔案索引</summary><ul><li>${L('f2','研究訪談')}：訪談紀錄。<b>本人陳述</b>，由研究部整理。</li><li>本頁上方各段：契約內容、能力與身體異化。<b>本人口述</b>與<b>研究部判斷</b>，各段已分別標示。</li><li>${L('inc','根基事件')}：樓層根基受損事件。<b>現場錄音、影像與通訊</b>，他親身參與。</li><li>${L('rec','通訊與錄音')}：個人通訊設備殘存錄音與私人留存紀錄。<b>設備錄音</b>；私人留存者未納入正式檔案。</li><li>${L('shade','實體觀測檔案')}：僅簡述其與白日之影的關係，不含個人資料。</li></ul></details>
<details><summary>親身參與的事件</summary><ul><li><b>進入實驗場、與白日之影交談</b>：本人口述，對應錄音見通訊與錄音的初期紀錄。</li><li><b>契約成立與姓名被取走</b>：本人口述與設備錄音。</li><li><b>根基事件</b>：現場紀錄。他接到召喚後離隊，前往樓層根基。</li></ul></details>
<details><summary>陳述與推測</summary><ul><li><b>本人陳述</b>：進入原因、契約過程、對白日之影的描述。</li><li><b>研究部判斷</b>：契約與身體異化之間的關聯、行為模式側寫。</li><li><b>尚有爭議</b>：見「契約關係評估」。</li></ul></details>
<h3 id="fc-body">契約與身體異化</h3>
<details><summary>異常標記</summary>背部肩胛骨周圍，向脊椎及下背部延伸。並非刺青或傷疤，結構似乎已與身體組織結合。特工通常刻意遮蔽，沒有證據顯示它具有獨立意識。REC-07 曾記錄隊員提及其背部會在能力使用後發熱；目前尚無法確認熱源是否來自標記本身，或與「觸及靈魂」能力有直接關係。</details>
<details><summary>眼部異常</summary>眼睛偶爾出現非自然的環狀紋路，可能與契約及靈魂感知有關，在能力發動時最為明顯。眼睛仍具一般人類的生理特徵，沒有證據顯示能免疫物理傷害。</details>
<details><summary>觸及靈魂</summary>特工如此稱呼自己的能力，可能察覺靈魂與肉體的異常連結、靈魂被撕裂或移除的跡象、外來靈魂附著，以及靈魂活動的痕跡。它不是讀心術，也不能直接辨識所有實體的真實身分。</details>
<details><summary>契約贈禮</summary>據稱 Shade 認為長柄立鐮「很有趣」，因此交給特工。它能斬傷幻影、笑魘等非實體之物；面對實體敵人，一次格擋就可能崩裂。</details>
<h3 id="fc-eval">研究部評估</h3>
<details><summary>研究部側寫：特工 <span class="stamp in s2">側寫</span><span class="stamp in">僅供內部參考</span></summary><ul><li><b>溝通風格</b>：以玩笑與反問緩衝，語氣輕鬆；談到他人安危時回答直接，不閃避。</li><li><b>迴避模式</b>：涉及契約、個人檔案與身體狀況的問題多半以玩笑帶過或拒答，其餘問題大多願意回答。</li><li><b>對實體的態度</b>：幾乎不見恐懼，也沒有崇拜或敵意；傾向把對方視為「尚未學會與人相處的對象」，並以此解釋它過去的行為。</li><li><b>風險認知</b>：多次把自身安全排在他人之後。建議留意其風險評估是否失衡，不宜以他的玩笑語氣推定「沒事」。</li><li><b>可信度</b>：陳述前後一致，與已知紀錄無明顯矛盾；未發現他隱瞞對其他人有立即危險的資訊。</li></ul></details>
<details><summary>契約關係評估與最後的通訊測試</summary>研究部判斷：存在能憑契約辨識特工的位置或狀態，部分異常能力源自契約。關於這段關係，契約能否解除、解除後能否恢復原有狀態，是目前最大的爭議。<br>一次未經安排的通訊測試中，特工對設備問：「${named?'Shade':'█████'}，你還記得我嗎？」約四秒後收到一段回應：「我會。」聲音與白日之影一致。本事件已封存。</details>
<h3 id="fc-int">訪談與補問</h3>
<details><summary>訪談節錄 TG-INT-01：契約與解除 <span class="stamp in">部分拒答</span></summary>${dlg('研究員','你與它之間存在契約。契約內容是什麼？')}${dlg('特工','嗯，這個啊，商業機密～')}<span class="ann">〔一涉及契約內容便以玩笑轉移，未提供任何可驗證資訊。〕</span>${dlg('研究員','你是否認為自己受到它的控制？')}${dlg('特工','有時候會覺得它知道得太多了。誰喜歡被一直盯著看？')}<p><i>研究部註記：</i>已確認其背部有非一般人體組織的異常標記，受訪者拒絕進一步檢查。<span class="stamp in">拒絕檢查</span></p>${dlg('研究員','包括背部的異常標記？')}${dlg('特工','你們連這個都知道？哇，工作效率不錯嘛。')}${dlg('研究員','你想解除契約嗎？')}${dlg('特工','這題也太不留情了吧。想過，還沒決定。我也想知道它到底在想什麼。')}${dlg('研究員','為什麼是你？')}${dlg('特工','這個問題你可能要去問它。')}${dlg('研究員','你知道它在你身上做了什麼嗎？')}${dlg('特工','知道一部分。')}${dlg('研究員','你對它抱持什麼感覺？')}${dlg('特工','哈哈，你一路追著問耶。這題我跳過。')}<div class="srow"><span class="stamp">拒答</span></div></details>
<details><summary>訪談節錄 TG-INT-01：暱稱與姓名 <span class="stamp in s3">已遮蔽（原名）</span></summary>${iv(`研:為什麼選擇 Shade 這個暱稱？\n特:一開始想叫 Shadow，太長就縮短了。它說名字只是人類稱呼自己的聲音，它不需要。我覺得它只是還不懂名字的意義。\n研:你的原始姓名是否與契約有關？\n特:有。可以說是它拿走的。\n研:你沒有要求歸還？\n特:沒有。現在也還過得去嘛。\n研:你真的不在意？`)}<span class="ann">〔談到原名時語氣轉淡，不再開玩笑，並主動結束提問。〕</span>${dlg('特工','你們問題問完了嗎？')}</details>
<p>訪談後補充（補問於臨時醫療站）：離開前他回頭問：「${named?'你們覺得 Shade 這個暱稱怎麼樣？':'你們覺得 █████ 這個暱稱怎麼樣？'}」只是想知道會不會太隨便。<span class="stamp in s2">補問紀錄</span></p>
<div class="card">訪談後備註：特工多次以玩笑轉移話題，但在涉及契約與個人資料時明顯較為謹慎，並主動要求結束訪談。研究部認為雙方存在長期且複雜的關係，不建議進一步要求公開契約細節。</div>
<h3 id="fc-app">音訊對照與附錄</h3>
<details><summary>SEC-A03 與 TG-AUD-003 的對照</summary>M.E.G.CN 保存的 SEC-A03（完整度約 78%）中，取暱稱的過程從「Shade，怎麼樣？」開始，之前有一段短暫雜音。它與紀錄 P-01 是同一事件的不同完整度版本，缺漏處正是「Shadow」那一段。</details>
<details id="fc-appd"><summary>附錄 D：內部通訊 INT-L-616-04 <span class="stamp in s2">疑似補寫</span><span class="stamp in">來源不明</span></summary><span class="ann">〔查無對應的發送與接收紀錄；發言代號與研究部名冊不符。此段於歸檔後出現，來源待查。〕</span>${dlg('研究員 A','我們目前仍然無法確認他的能力來源。')}${dlg('研究員 B','但他顯然知道那個存在。')}${dlg('研究員 A','知道不代表能夠控制。如果那個存在能夠透過他影響我們呢？')}${dlg('研究員 B','那就繼續觀察。至少目前為止，他救過的人比他帶來的麻煩多得多。')}${dlg('研究員 C','那我們應該把他當成什麼？')}${dlg('研究員 B','他仍然是我們的特工。')}<span class="ann">〔已列入${L('unf','未歸檔資料')}（U-005）。〕</span></details>
<details id="fc-appe"><summary>附錄 E：無人操作的通訊紀錄 REC-L-616-UNKNOWN</summary>M.E.G.CN 通訊設備在無人操作時自行啟動，錄到一個未知聲音：「他今天沒有回來。」短暫停頓。「以前會。」約十秒後：「你們知道他去哪裡了嗎？」設備隨即自行關閉，聲音與白日之影一致。</details>
<div class="card warn">研究部：以上內容不得作為特工與 Shade 完全互信的證據。雙方在人類生命、身體自主、疼痛與姓名的意義上仍有明顯認知差異。任何人不得擅自以特工的名義向 Shade 提出要求。</div>`},

hist:{n:'樓層歷史',l:1,h:()=>`<h2>樓層歷史</h2><div class="meta"><div><i>歷史最高評估</i>Class 5</div><div><i>資料管理單位</i>M.E.G.CN 康幕委員會（最高管理層）</div></div>
<p class="lgd">依時間順序整理。危險機制、傷亡案例與研究部判斷見${L('f1','早期危險評估')}。</p>
<details><summary>不以實體現身為前提的樓層特徵</summary><p>即使沒有觀測到白日之影直接現身，Level -616 仍反覆呈現幾項可獨立記錄的現象：空間連接不遵循固定平面、房間外觀與用途可能錯置、出口會在條件成立後出現，以及計時、記憶與感官狀態可能異常（見${L('space','空間結構')}、${L('anom','特殊物品與特殊狀態')}）。實體與樓層根基的因果關係仍是研究部的主要假說之一。</p></details>
<details open><summary><span class="sum-code">階段一</span>最初發現（約 1936 年起）</summary><p>最早期的探索紀錄已無法完整追溯。樓層在建立編號之前，就已出現在流浪者的口述中。早期倖存者的描述共通處：進入封閉的空房間、沒有出口指示、離開後進入規則各異的空間、經常在不知情下被迫參與測試，部分房間極度致命且無法中止。</p><p>它曾被稱為「考場」「白色迷宮」「審判室」。「實驗場」一詞最早見於研究部早期的調查紀錄，因最貼近內部運作而被採用。</p></details>
<details><summary><span class="sum-code">階段二</span>早期樓層狀態（約 1952–1987 年）</summary><p>當時規則不穩定：倒數歸零卻無事發生；通過的房間重新出現且結構不同；試煉結束後仍被迫留在原地；出口在參與者死亡後才開啟；空房間裡聽見交談聲。死亡人數不詳，早期資料缺乏統一的紀錄標準；詳細紀錄見${L('f1','早期危險評估')}。</p></details>
<details><summary><span class="sum-code">階段三</span>M.E.G.CN 初期調查（約 1988–2019 年）</summary><p>首批小隊的目標是探明空間結構、分類危險程度、整理規則、尋找穩定出口，並查明是否有智慧實體。多支隊伍失聯，或離開後無法描述房間。早期證詞反覆出現：「房間好像知道我們在做什麼。」當時被歸為高壓下的主觀感受。</p></details>
<details><summary><span class="sum-code">階段四</span>危險程度變化（前年度起，延續至今年度 8 月）</summary><p>致命機關停止、倒數允許放棄、嚴重傷害前提早中止試煉、需犧牲人員的出口出現其他通過方式。這些變化並非同時發生，也沒有設備可解釋。研究部認為這些變化出自白日之影自身態度的轉變，原因列為機密。</p></details>
<details><summary><span class="sum-code">階段五</span>現行狀態（今年度 9 月起）</summary><p>現行評估為 Class 1，多數房間不再以致命結果作為完成條件，實驗可在極限處中止（見${L('rules','房間規則')}）；部分房間呈現新的功能配置（見${L('space','空間結構')}），早期實驗的結構也仍有保留。今年度 9 月發生過一次樓層根基受損的事件，詳細經過列為機密（見${L('inc','根基事件')}）。</p></details>
`},
exp:{n:'探索紀錄',l:1,i(){$('#rd').onclick=e=>{e.target.textContent='不要把一個人當成整個樓層的保證。';e.target.classList.add('on')}},h:()=>`<h2>探索紀錄</h2><p class="lgd">探索者回報與回收影像整理。早期（階段一至三）的探索資料過少，且大部分已遺失；以下登錄紀錄自前年度起。</p><div class="card"><b>資料判讀原則</b><ul><li><b>直接觀察</b>：回報、影像或錄音中可辨識的動作、文字與時間。</li><li><b>研究部判讀</b>：由多筆觀察推導的可能機制，除非另有驗證，不視為已確認規則。</li><li><b>未確認</b>：資料缺失、時間碼無法對照，或存在其他合理解釋的部分。</li></ul>本頁保留原始回報的敘述方式；「房間在評估什麼」等解釋均屬暫定判讀，不代表已證實的樓層意圖。</div>
<details id="ex-01" open><summary>EX-01 多餘的房間</summary><p class="lgd"><span class="sq">前年度・序 1</span>房間：重複房間　日期：20██/10/08　來源：探索者回報<br>人數 3　結果 全員離開　耗時 約 8 小時　傷亡 無</p>連開六扇門，每間都是相同的白色房間，地上沒有腳印。停止開門約二十分鐘後，牆面裂開，出現一扇灰色門。研究部推測，停止重複開門可能是該次出口出現的條件；現有紀錄不足以證明這是唯一的通過方式。</details>
<details id="ex-02"><summary>EX-02 提前結束</summary><p class="lgd"><span class="sq">前年度・序 2</span>房間：合作房間　日期：20██/10/21　來源：探索者回報<br>人數 5　結果 全員離開　耗時 約 9 小時　傷亡 無</p>五個操作台，螢幕要求達成共識後同時啟動。討論兩小時仍無結果，其中一人自行啟動，其餘四台隨即亮起。研究部推測，該房間可能記錄了隊伍如何回應共同決定遭到違反；此判讀尚未獲得其他案例驗證。</details>
<details id="ex-03"><summary>EX-03 提前停止的試煉</summary><p class="lgd"><span class="sq">前年度・序 3</span>房間：選擇房間　日期：20██/10/22　來源：探索者回報<br>人數 2　結果 全員離開　耗時 約 4 小時　傷亡 一人精神受影響</p>兩人無法達成共識，其中一人精神不穩。隊員說「我不想繼續了。」約三秒後有聲音答：「可以。」設備隨即停止，牆面出現出口。這是較早具完整音訊的提前終止案例。</details>
<details id="ex-04"><summary>EX-04 沒有正確答案的題目</summary><p class="lgd"><span class="sq">前年度・序 4</span>房間：選擇房間　日期：20██/11/19　來源：探索者回報<br>人數 4　結果 全員離開　耗時 約 11 小時　傷亡 無</p>螢幕提出 A「協助資源不足的陌生人」與 B「離開並保留資源」。隊伍討論四十分鐘後選擇 A，房間沒有立即反應；螢幕接著問：「為什麼？」二十秒後出口開啟。現有紀錄未能證明房間設有預設答案。</details>
<details id="ex-05"><summary>EX-05 兩份相同的答案</summary><p class="lgd"><span class="sq">今年度・序 5</span>房間：選擇房間　日期：20██/01/13　來源：探索者回報<br>人數 4　結果 全員離開　耗時 約 5 小時　傷亡 無</p>每人獨立輸入「最值得信任的人」，螢幕顯示的四份答案完全相同，時間戳記一致，而且有人說自己並沒有選那個人。答案沒有被修改，結果由房間統一。</details>
<details id="ex-06"><summary>EX-06 沒有完成的第七項試煉</summary><p class="lgd"><span class="sq">今年度・序 6</span>房間：白房間　日期：20██/01/23 00:47　來源：探索者回報<br>人數 6　結果 全員離開　耗時 約 18 小時　傷亡 無</p>第六項之後進入白房，紙上寫：「你們已經完成了。」隊伍以為這是第七項，一名隊員說：「那就走吧。」原本不存在的出口隨即出現。<p class="note">檔案時間戳與 PRV-03 同為 20██/01/23 00:47；由於兩份紀錄的時鐘校準狀態不明，且樓層空間並非線性，無法確認兩件事是否發生於同一實際時刻。</p></details>
<details id="ex-07"><summary>EX-07 空房間裡的聲音</summary><p class="lgd"><span class="sq">今年度・序 7</span>房間：觀察房間　日期：20██/02/09　來源：探索者回報<br>人數 1　結果 成功離開　耗時 約 10 小時　傷亡 無</p>空白房間，三十分鐘後有聲音問：「你在等什麼？」「為什麼？」「那為什麼不繼續？」探索者答：「因為我不想死在這裡。」長沉默後聲音說：「知道了。」十秒後出口開啟。推測聲音來自白日之影。</details>
<details id="ex-08"><summary>EX-08 第七十二小時</summary><p class="lgd"><span class="sq">今年度・序 8</span>房間：限時房間　日期：20██/03/02–03/05　來源：回收影像<br>人數 2　結果 全員離開　耗時 約 3 日　傷亡 一人輕傷</p>生活設備齊全的房間，倒數 72:00:00。倒數剩約三小時時，螢幕關閉，床下出現檢修門。回收影像顯示該門早已存在，但先前影像裡那處地板完整。</details>
<details id="ex-09"><summary>EX-09 不存在的隊友</summary><p class="lgd"><span class="sq">今年度・序 9</span>房間：記憶與感知房間　日期：20██/04/06　來源：探索者回報<br>人數 5　結果 全員離開　耗時 約 13 小時　傷亡 無</p>六張椅、六份資料，其中一份屬於名單上沒有的人，卻包含完整姓名與經歷。第六張椅自行後移，文件消失。事後有隊員問：「我們原本是不是有六個人？」</details>
<details id="ex-10"><summary>EX-10 第三個人</summary><p class="lgd"><span class="sq">今年度・序 10</span>房間：合作房間　日期：20██/05/27　來源：回收影像<br>人數 3　結果 2 人離開，1 人失蹤　耗時 約 6 小時　傷亡 1 人失蹤</p>三張椅子，螢幕稱「尚有一位參與者未就座」。一名隊員轉向空牆角與看不見的對象交談，說出「你不是已經坐下了嗎？」，約四十秒後從影像中消失。</details>
<details id="ex-11"><summary>EX-11 不需要回答</summary><p class="lgd"><span class="sq">今年度・序 11</span>房間：觀察房間　日期：20██/07/15　來源：探索者回報<br>人數 1　結果 成功離開　耗時 約 2 小時　傷亡 無</p>紙上問：「你為什麼來到這裡？」探索者不作答，文字消失後又問：「你不想回答嗎？」他說：「不知道也可以吧。」紙上最後出現「可以。」研究部暫將沉默記為該次房間接受的回應，尚不能推定所有問答房間都採用相同規則。</details>
<details id="ex-12"><summary>EX-12 不能說謊的房間</summary><p class="lgd"><span class="sq">今年度・序 12</span>房間：問答房間　日期：20██/08/17　來源：探索者回報<br>人數 3　結果 全員離開　耗時 約 7 小時　傷亡 無</p>三個問題：是否拋棄過需要幫助的人、是否為自身安全隱瞞資訊、是否認為所有選擇都正確。回答完畢後牆面顯示：「你們不需要說實話。」無任何懲罰。</details>
<details id="ex-13"><summary>EX-13 初始房間</summary><p class="lgd"><span class="sq">今年度・序 16</span>房間：初始房間　日期：20██/10/05　來源：探索者回報<br>人數 小隊　結果 全員通過　耗時 約 6 分鐘　傷亡 無</p>小隊皆出現在白色立方體；有人輕敲牆面，確認無中空（不建議）。約六分鐘後右側出現門，門後是普通辦公室。該次紀錄未觀察到危險。</details>
<details id="ex-14"><summary>EX-14 異常出口</summary><p class="lgd"><span class="sq">今年度・序 17</span>房間：異常房間　日期：20██/10/12　來源：探員回報<br>人數 1 名探員　結果 第二次通過後抵達另一樓層　耗時 未載　傷亡 無</p>探員第一次通過出口，抵達與原本相同的走廊；返回確認無變化，第二次通過卻抵達另一樓層。</details>
<details id="ex-15"><summary>EX-15 實體接觸</summary><p class="lgd"><span class="sq">今年度・序 18</span>房間：觀察房間　日期：20██/10/26　來源：探索者回報<br>人數 1 人　結果 第二扇門出現　耗時 未載　傷亡 無</p>${dlg('聲音','你為什麼不走？')}${dlg('流浪者','我在等同伴。')}沉默約十秒後，房間出現第二扇門。</details>
<details id="ex-16"><summary>EX-16 實驗中止</summary><p class="lgd"><span class="sq">今年度・序 19</span>房間：未載　日期：20██/11/02　來源：探索者回報<br>人數 1 人　結果 實驗中止，出口開啟　耗時 未載　傷亡 精神狀態到達極限</p>流浪者的精神狀態到達極限，所有裝置停止，出口開啟。離開前聽見：「結束了。」</details>
<details id="ex-17"><summary>EX-17 沒有任務的長椅</summary><p class="lgd"><span class="sq">今年度・序 20</span>房間：陪伴房間　日期：20██/11/05　來源：探索者回報<br>人數 2　結果 全員離開　耗時 約 4 小時　傷亡 無</p>病房般的房間，床上沒有人，床邊有一張椅子。兩人互相推讓，檢查床單、尋找暗門，一無所獲。其中一人說自己累了，坐下；十分鐘後另一人也坐下，沒有人說話。約四小時後，床頭櫃上出現一杯溫水，牆面出現門。房間全程沒有給任何指示。<p class="note">判讀限制：現有紀錄無法確認出口出現的觸發條件是停留時間、陪伴行為，或其他未觀測因素。</p></details>
<details id="ex-18"><summary>EX-18 一千個箱子</summary><p class="lgd"><span class="sq">今年度・序 21</span>房間：勞務房間　日期：20██/11/09　來源：探索者回報<br>人數 4　結果 全員離開　耗時 約 14 小時　傷亡 一人手部扭傷</p>倉庫裡堆滿相同的紙箱，牆上標示要把它們搬到對面牆邊。隊伍先找暗號、數箱子、拆箱（皆為空箱），三小時後有人決定單純搬運，眾人輪流休息。途中有人說「不搬了」，牆面沒有反應，隊伍討論後決定繼續。最後一箱放下時對牆打開，牆上寫著：「謝謝。」<p class="note">判讀限制：本次紀錄只能確認「完成搬運後出口開啟」。隊員曾提出停止，但最後沒有實際中止工作，因此不能據此宣稱中途放棄也能離開；房間是否在評估合作、耐心、勞務完成或其他因素，仍未確認。</p></details>
<details id="ex-19"><summary>EX-19 第七號帶子</summary><p class="lgd"><span class="sq">今年度・序 22</span>房間：見證房間　日期：20██/11/14　來源：探索者回報<br>人數 3　結果 全員離開　耗時 約 5 小時　傷亡 無</p>空房間裡有一台播放機，播放一名陌生人的口述，內容與任何隊員無關。每隔數分鐘暫停，等待有人回應。隊伍決定輪流聽完並簡短記下重點。全部結束後，播放機吐出一張紙：「記得就夠了。」</details>
<details id="ex-20"><summary>EX-20 可以睡覺的房間</summary><p class="lgd"><span class="sq">今年度・序 23</span>房間：休息房間　日期：20██/11/18　來源：探索者回報<br>人數 5　結果 全員離開　耗時 約 10 小時　傷亡 無</p>有五張床與熱食的房間。隊員輪流警戒，沒有任何事發生。全員睡過一輪後，床頭燈熄滅，門出現。事後有人表示，那是離開樓層前最後一次真正睡著。<p class="note">判讀限制：隊伍有輪流警戒，不能據此推定所有休息房間都安全。</p></details>
<details id="ex-21"><summary>EX-21 沒有回音的走廊</summary><p class="lgd"><span class="sq">今年度・序 24</span>房間：過渡空間　日期：20██/11/20　來源：回收紀錄儀（未見人員）<br>人數 2（推估）　結果 失聯　耗時 紀錄儀持續運作 19 小時　傷亡 未確認</p>兩名非組織流浪者的隨身錄音設備在 Level 2 管線區被拾獲。音檔顯示兩人在白色長廊中以固定步速前進，每隔十分鐘報一次數，直到第 64 次報數後，其中一人的腳步聲突然中斷，另一人並未察覺，仍獨自繼續報數至電量耗盡。全程未觀測到實體介入跡象。</details>
<details id="ex-22"><summary>EX-22 雙向門牌</summary><p class="lgd"><span class="sq">今年度・序 25</span>房間：空間結構異常　日期：20██/11/21　來源：測繪組無人機紀錄<br>人數 0（無人機）　結果 訊號中斷　耗時 43 分鐘　傷亡 無</p>無人機沿同一條直線走廊飛行，連續通過七扇標有「出口」的門牌，每次穿過後測繪儀顯示座標完全未變，但畫面中的牆面踢腳線高度逐次上升約三公分。第七次穿過後，鏡頭畫面被純白填滿，隨後訊號切斷。</details>
<h3>M.E.G.CN 現行評估</h3><p>評估範圍與風險說明見${L('home','樓層概述')}。<span class="red" id="rd">████████</span>（點擊）</p>`},
anom:{n:'特殊物品與特殊狀態',l:1,h:()=>`<h2>特殊物品與特殊狀態</h2>
<details id="i-01" open><summary>I-01 未完成的門</summary>缺少完整門扇與門框的入口，無把手，無法以工具破壞，門框內是無法辨識的空間，並非始終存在。一支四人隊伍中，兩人看得見門框，另外兩人看見的牆面毫無變化。它不是有效出口。</details>
<details id="i-02"><summary>I-02 空白紀錄器</summary>外觀似一般紀錄器，研究部推測可能與白日之影有關，目前尚未確認設置者；只能錄音。探索者離開房間後，部分設備會自動生成不超過十秒的音訊：「他沒有回答。」「這次不一樣。」「還可以繼續。」「已經結束了。」「下一個。」</details>
<details id="i-03"><summary>I-03 停止的計時器</summary>顯示時間與外界不一致：倒數停止但人可正常活動；歸零後無事發生；顯示持續增加的負數；拆除後仍在原處顯示數字；不同人看見不同的時間。</details>
<details id="i-04"><summary>I-04 觀測窗口</summary>普通玻璃窗，另一側是獨立的房間，可看見其他隊伍試煉，對方似乎無法察覺觀測者。部分畫面並非即時：窗內隊伍的動作與數小時前回收的影像完全一致。</details>
<details id="i-05"><summary>I-05 多餘的鑰匙</summary>無法對應任何已知門鎖，不開啟房間內原有的門，但持有期間，所在房間的部分異常會暫時停止活動。</details>
<details id="i-06"><summary>I-06 行為矯正錄音</summary>一組共七段的音訊檔案，格式不明，無建立日期、錄製設備或持有者資訊，僅以 01 至 07 編號。可正常播放，但無法複製到實驗場以外的儲存設備；部分檔案播放結束後會自行重新排列。內容為一名男性與未知實體的對話，音檔收錄於通訊紀錄「I-06 行為矯正錄音」。</details>
<h2 style="margin-top:1.6em">特殊狀態</h2>
<details id="s-01"><summary>S-01 被注視</summary><p class="lgd">感官干涉　觸發：長時間處於具觀察性質的房間，或被未知存在持續注視</p><p><b>症狀</b>：覺得牆上的畫像在注視自己、身後有人移動、物體位置與記憶不同。<b>效果</b>：可能提前察覺異常，也會把正常現象誤判為危險，越來越難分辨真異常與錯覺。<b>解除</b>：離開該房間，並暫停觀察異常物件。</p></details>
<details id="s-02"><summary>S-02 記憶錯位</summary><p class="lgd">認知干涉　觸發：接觸具記憶重組性質的房間或物品</p><p><b>症狀</b>：把隊友的經歷當成自己的，或記得沒發生過的對話。<b>效果</b>：對錯誤記憶高度確信；多人受影響時記憶會互相矛盾。<b>解除</b>：以外部紀錄、通訊設備或未受影響的隊員確認經歷。</p></details>
<details id="s-03"><summary>S-03 角色置換</summary><p class="lgd">身分認知干涉　觸發：參與具身分判定或角色分配規則的實驗</p><p><b>症狀</b>：誤以為自己是領導者、隊友該服從自己，或必須完成別人的任務。<b>效果</b>：堅持執行不屬於自己的任務，對隊友產生陌生感，但不改變性格與價值觀。<b>解除</b>：重新確認姓名、職責與任務分配，或離開該房間。</p></details>
<details id="s-04"><summary>S-04 感官交換</summary><p class="lgd">感官異常　觸發：接觸具感官轉換性質的裝置或房間</p><p><b>症狀</b>：聽見顏色、看見聲音的形狀、把疼痛誤認為溫度變化。<b>效果</b>：有時能發現隱藏線索（例如聲音顯示為裂縫），但不保證資訊正確。<b>解除</b>：離開實驗區域後自行消退。</p></details>
<details id="s-05"><summary>S-05 結果預知</summary><p class="lgd">預知干涉　觸發：接觸具結果預測性質的房間</p><p><b>症狀</b>：推門前看見門後崩塌、聽見隊友尚未說出的話、看見自己倒地。<b>效果</b>：預知未必成真；改變行動可能改變結果，也可能產生新的異常。<b>解除</b>：該房間的實驗結束後消失。</p></details>
`},
appx:{n:'研究附錄',l:2,h:()=>`<h2>研究附錄</h2>
<details id="apx-a"><summary>附錄 A：實驗中止協議補充</summary>實驗中止協議觸發後，直到探索者離開該房間前，房間造成的後續傷害會受到限制；協議不會治療既有傷勢，也不代表所有異常效果立即解除。該協議同樣適用於特殊異常個體，相關事件見根基事件。</details>
<details id="apx-b"><summary>附錄 B：關於白日之影的定位</summary>研究部早期曾提出三項假說：樓層管理者、樓層本身產生的意識、外來異常實體。現行結論是：它既不是管理者，也不是單純的樓層意識，而是與樓層共生的獨立個體。它在樓層之外是否有獨立的本體，仍有爭議（見實體觀測檔案）。</details>
<div class="card">最終研究備註：值得持續關注的，不只是房間設備與試煉本身的危險性，也包括長期存在於樓層內的白日之影。M.E.G.CN 建議維持觀察、避免主動干涉。它的能力、限制與代價見${L('shade','實體觀測檔案')}。</div><div class="card warn">契約關係評估、通訊測試與保存音檔對照等資料列為高度機密，見${L('fc','契約與人員紀錄')}。</div>`},
inc:{n:'根基事件',l:3,h:()=>`<h2>機密檔案：樓層根基完整度異常事件</h2><div class="meta"><div><i>檔案編號</i>M.E.G.CN-INCIDENT-███</div><div><i>事件日期</i>20██/09/12（今年度・序 13；對應通訊紀錄 09）</div><div><i>狀態</i>部分解密</div><div><i>相關</i>特工、白日之影</div></div>
<details open><summary>樓層根基與兩種判定</summary>實驗場可能存在維持穩定的核心結構「樓層根基」，其位置與外觀均未知。部分紀錄顯示，持續破壞房間、設備與運作結構後，樓層會出現連鎖異常；相較之下，為救援受困者而破壞機關的案例，尚未觀察到明確的根基損傷。兩者差異可能與破壞規模、位置或行為目的有關，但目前無法確認。因此存在兩種機制：<br><b>業力傾向</b>：記錄行動對其他生命造成的影響，包括是否協助他人、傷害生命、為自身利益犧牲他人、承擔後果，以及造成傷害後是否補救；它描述的是行為後果，不等同於單次善惡判決。<br><b>根基完整度</b>：記錄樓層核心結構是否受損，包括破壞核心設備、大規模破壞結構、強行干涉空間連結，以及非必要地破壞穩定。前者偏向行為對生命造成的影響，後者偏向樓層結構本身的狀態。兩者可能互相影響，但目前沒有證據能還原其判定方式，也不能互相替代。</details>
<details><summary>崩解事件的處置流程</summary><ol><li><b>召喚</b>：樓層根基遭到嚴重破壞、實驗系統失控時，白日之影會召喚與其有契約關係的特工介入。特工了解它對人類承受能力與傷害程度的認知缺陷，會設法阻止它在失控時進一步擴大破壞。他離隊前的那則通訊，就是對這次召喚的回應（見「事件經過」）。</li><li><b>交涉</b>：特工先詢問流浪者是否願意停止破壞並直接離開（對話見通訊紀錄 09）。</li><li><b>分歧</b>：在本次根基崩解事件中，接受特工勸離、選擇逃跑，或在交戰中被特工制伏的進入者，都會被傳送至 Level 995「因果之地遊樂園」。這是本次事件的處置方式，不代表一般情況下的離開者都會被送往該處。</li><li><b>實驗中止</b>：特工遭到重創、已無法繼續行動時，樓層原有的實驗中止協議再度觸發，所有實驗暫停，房間停止崩解。</li><li><b>現身</b>：白日之影親自現身，詢問倒下的特工是否還能繼續（見通訊紀錄 06、09）。</li><li><b>最終階段</b>：若特工無法繼續介入，白日之影將接替其位置，成為最終的敵對目標，直接對仍留在樓層內的流浪者發動攻擊，範圍涵蓋整座樓層。現有紀錄未顯示能以物理攻擊擊敗它。</li><li><b>後續處置</b>：特工不因流浪者過去的選擇而否定其停止傷害的可能。依本次事件紀錄，只要願意停止，即使已造成大量損害，仍可能獲得離開現場的機會；但既有傷害不會因此消失，相關人員仍須在 Level 995 面對後續處置。若白日之影在最終階段控制局面，曾對樓層及其他生命造成嚴重傷害者，可能無法離開，之後的去向列為機密。</li></ol><p class="note">本節流程依本次事件的有限紀錄重建，不代表所有根基異常都必然依相同順序發生；部分階段可能重疊，亦可能因現場條件而改變。</p></details>
<details><summary>事件經過</summary>多名探索者在連續試煉中的異常行為，使多個房間的規則同時失效。依現有資料，白日之影的召喚發生於根基完整度已開始下降、但尚未全面崩解之時；特工先向隊伍發出一則簡短通訊（未收錄於錄音），隨後離隊前往異常區域。約二十分鐘後，樓層才進入全面崩解階段：牆壁失去結構、房間重疊、重力方向改變、多個出口失效、試煉設備自行運作，並出現大量空間裂縫。REC-09 開頭的求援無線電，是特工抵達異常區域後向總部發出的第二次通訊，並非召喚本身；當時樓層內仍有多支隊伍。</details>
<details><summary>影像 SEC-B02（完整度約 52%，無有效音軌，與 REC-09 對照）</summary>影像與 REC-09 並非同一時間碼系統。以下所列時間，除另有註明外，均以 REC-09 錄音時間為準；影像與錄音的對應關係，僅依可辨識的動作、聲音及設備停止時間交叉判讀。影像 00:00 約對應錄音 01:24。特工手持一件長柄鐮刀，在變形的走廊與數名探索者對峙，多次舉手示意停手，沒有主動揮擊（對應錄音 01:24–03:02 的勸阻）。由於白日之影具備聲音模仿能力，錄音中的人聲歸屬仍須以影像動作與通訊時序交叉判讀。錄音 03:30 起的碰撞，在影像中是迴避、格擋與限制對方行動，沒有明確的致命意圖。約 03:51 部分人影在畫面中消失，同時錄音出現遠處旋轉木馬般的音樂。REC-09 中白日之影所稱的「讓他們消失」，實際意義尚未完全確認；現有影像與傳送紀錄顯示，至少部分人員是在該時段被移出 Level -616，並無證據足以認定其遭到殺害。04:05 再次碰撞後他倒地，四周設備同時停止（對應 04:19 的靜止）。其後白日之影的聲音由畫外傳入，影像中沒有可辨識的形體。完整對話見通訊紀錄 09。</details>
<details><summary>後續</summary>特工停止行動後，房間停止崩解，部分出口重現。白日之影隨後出現，並接管空間結構，重新排列房間，移除部分房間，將探索者分散到不同空間。傳送對象見「分歧」；未被傳送離開、仍留在樓層內的人員，後續由白日之影處置。其處置方式與去向尚未完全解密。有倖存者稱在抵達前看見實驗場的房間逐漸消失，也有人聲稱看見持長柄鐮刀的 M.E.G.CN 人員倒在白色房間內；該人員其後已重新出現在人事與任務紀錄中。事件後特工接受處置，身體狀況逐步恢復，並重新具備基本行動能力。其後仍有新的受傷紀錄，原因與經過尚未完整確認（見今年度 09/16 通訊紀錄 P-06）；白日之影對特工再次受傷表現出明顯的警戒與保護傾向。</details>`},
unf:{n:'未歸檔資料',l:1,h:()=>`<h2>未歸檔資料</h2><div class="meta"><div><i>資料來源</i>未知／自動寫入／待確認</div><div><i>狀態</i>未完成歸檔（部分條目無法重現）</div></div>
<p>下列項目無法歸入任何正式分類。M.E.G.CN 已複製原始檔案，異常版本獨立封存；內容未經證實。部分條目重新開啟時，位置或字句與上次不同，無法確認哪一版是原始版本。技術組備註：部分文本詞彙與異常能力條目在游標停留或觸碰時會出現輕微殘響，原因待查。</p>
<details id="u-001" open><summary><span class="sum-code">U-001</span>房間規則</summary><p class="lgd">原始檔案：${L('rules','房間規則')}／異常狀況：頁面末端多出一行字（再次開啟時已不在原位）</p><p class="it">「你們把規則寫得很整齊。」</p></details>
<details id="u-002"><summary><span class="sum-code">U-002</span>探索紀錄</summary><p class="lgd">原始檔案：${L('exp','探索紀錄')}／異常狀況：頁面末端多出一行字。未能確認「他們」所指的對象</p><p class="it">「他們有離開嗎？」</p></details>
<details id="u-003"><summary><span class="sum-code">U-003</span>特殊物品</summary><p class="lgd">原始檔案：${L('anom','I-02 空白紀錄器')}／異常狀況：備註欄出現額外文字，數小時後欄位恢復空白</p><p class="it">「我也想錄下來。」</p></details>
<details id="u-004"><summary><span class="sum-code">U-004</span>探索紀錄</summary><p class="lgd">原始檔案：${L('home','Level -616')}／${L('exp','探索紀錄')}／異常狀況：文件末尾出現額外文字；已發現兩個版本，最後一句不同</p><p class="it">「你們把這些東西放在一起。」<br>「我可以看。」<br>「所以我也想知道，你們為什麼要記錄它們。」<br>（另一版：「……為什麼要記錄。」）</p></details>
<details id="u-005"><summary><span class="sum-code">U-005</span>內部通訊</summary><p class="lgd">原始檔案：${L('fc','契約與人員紀錄')}／附錄 D：INT-L-616-04／異常狀況：歸檔後多出整段對話，發言者不在研究部名冊</p><p class="it">「他仍然是我們的特工。」</p></details>
<details id="u-006"><summary><span class="sum-code">U-006</span>I-06 行為矯正錄音</summary><p class="lgd">原始檔案：${L('rec','I-06 行為矯正錄音','I-06/01')}／異常狀況：第七段結束後，目錄偶爾多出一個未編號的音訊檔</p><p class="it">（咳。四秒。）</p></details>
<details id="u-007"><summary><span class="sum-code">U-007</span>（標題缺失）</summary><p class="lgd">原始檔案：無法確認／異常狀況：目錄中有此條目，內容無法開啟；每次查閱時列出的位置不同</p><p class="it">（空白。）</p></details>`},

else{$('#main').innerHTML=p.h()+nxt(id)+rel(id);p.i&&p.i()}
$('#main').style.animation='none';void $('#main').offsetWidth;$('#main').style.animation='';nav();post();scrollTo(0,0);whisper()}
const GR=[['01 · 正式資料',['home','rules','space','base','anom','exp','sim']],['02 · 研究資料',['shade','hist','f1','f2','appx']],['03 · 機密檔案',['fc','inc']],['04 · 通訊與音訊',['rec']],['05 · 非正式資料',['unf','talk']]];

n|02:01　咀嚼聲停止。約3秒無人說話。
a|……你們不會是想拿我當爐子吧？
o|隊員A：可以嗎？
a|哈哈哈！這也太有創意了！來來來，我配合！
n|02:31　衣料摩擦與重物落地的悶響，疑似有人趴下。
a|本日限定燒烤店，即將開張～
o|隊員B：你別亂動啊。
a|是是是，收到。
n|03:05　接下來的約20秒，只聽得見遠處風扇規律轉動的聲音。鋁箔紙邊緣傳來細微的劈啪聲。隊員A低聲說了一句〔無法辨識〕。
o|隊員A：欸，真的有熱！現在可以倒了嗎？
a|可以可以，慢慢倒，別灑到我身上就好。
n|03:40　罐頭滑動聲，接著是「滋」的一聲。所有人同時安靜。
o|隊員C：特工，你真的不會燙傷？
a|放心啦，溫度我自己有數。怎麼樣，這廚具是不是很高級？自動加熱，附贈智慧控溫。
o|隊員B：高級在哪？
o|隊員C：在於他會講話。
n|04:22　笑聲（三人以上），餐具刮擦聲，一度蓋過語音。
o|隊員A：……好吃。熱的真的不一樣。
a|那當然，本店對溫度很講究的。
o|隊員B：老闆，再來一份！
a|抱歉，今天限量，已經打烊了。
o|隊員C：欸，這麼難得，拍張照紀念一下？
a|不行。
n|05:14　回答幾乎沒有間隔，語速明顯快於前後對話。隊員C停頓約3秒。
o|隊員C：咦？為什麼？
a|這個嘛～料理可以公開製作，攝影服務不提供。商業機密！
o|隊員B：小氣。
a|沒辦法呀，開店不容易。
n|05:52　眾人嬉鬧聲。夾雜一陣衣料拉扯聲，疑似有人在整理衣服下襬。
o|錄音者無意間記下他對「拍照」的反應速度與其餘對話明顯不同，其後立即以玩笑掩飾。推測他拒絕的是背部被拍到，而非料理本身。
o|研究部：無法確認此能力與背部異常標記是否有關。特工拒絕說明。
i|罐頭放在他們中間，是熱的。第一個開口的人，先伸了手。`],
['10','實驗中止後之行為觀察','特工聯絡對講機　現行規則形成後<br>檔案：REC-██-10　錄製：20██/09/14 14:30　時長：02:12<br>來源：特工聯絡對講機　訊號：良好',`n|00:00　走動聲，腳步輕，節奏不均。
a|最近的房間好像比較簡單了？
s|是。
a|出口也變多了。那些會傷人的裝置呢？
s|已經停止。
n|00:25　空氣流動聲，像走廊另一端的門被推開又合上。

s|出口已經出現。這代表他們能離開。

n|01:07　只剩設備底噪，約8秒。腳步聲停在原地，鞋底輕輕磨過地面。
s|……
a|中間發生的事情也很重要。
s|我會記得。

n|01:38　特工突然大笑，笑聲持續約4秒。

n|02:12　笑聲。錄音結束。
o|本檔案被研究部列為「現行規則形成之後」的第一份參考。雙方語氣都有明顯變化，不過 Shade 的句型仍然偏向直接引用過去的對話。`],
['P-05','規則','特工私人語音備忘錄　未提交<br>檔案：PRV-██-05　錄製：20██/09/05　時間不明　時長：05:26<br>來源：特工聯絡對講機（語音備忘，自錄）　訊號：良好',`n|00:00　錄音開始。特工清了清喉嚨。
a|嗯……備忘錄，好，開始。我先講我自己的，萬一以後忘記。
a|第一，初始房間不一定相同。有時還是白色房間，有時門一開就是……熟悉的地方。普通辦公室、沒有出口的長廊、空無一人的住宅、一整面都是觀察窗的實驗室，還有……跟我過去的事有關的。看到那種房間，我每次都要站一下才進得去。
n|00:58　約6秒無人出聲，日光燈鎮流器的嗡聲持續。
a|還有一些我根本沒看過的房間。這些……好像是它刻意安排的。我不喜歡。可是又說不出它哪裡錯了。
a|第二，它通常會立刻發現，不用我叫。有時候我還沒進去，房間就已經變了。……說實話，有點煩，也有點安心。這句不用留。
n|01:30　房間內傳來走動聲。錄音開始出現第二個聲源。
s|你今天為什麼來？
a|來看看你啊。
n|01:44　背景聲音恢復單一。特工繼續說話，但音量降低。
a|第三，房間會依照我的狀態改變。帶傷進去的話，有些房間會減少障礙，甚至給我休息的地方，但不一定。（這條我不確定，下次再看。）
n|02:33　機械運作聲，像是醫療儀器。持續約15秒。
s|你需要修復。
n|02:45　遠處傳來空調機組啟動的低沉運轉聲，持續約兩秒。
a|不用，謝謝。
n|02:58　儀器聲沒有消失，也沒有靠近麥克風。
a|第四，特殊實驗。身體、異常標記、靈魂跟肉體的連結、契約本身、我的記憶、我對別人的態度，還有它對我的觀察。……這條要怎麼寫。先空著。
a|我的狀態到達極限時，不會立刻被送出去，實驗會先中止。接著它就會自己出現。
s|還能繼續嗎？
a|我說不，或者不回答，它就不會強迫。要是我說可以，它可能換內容，也可能讓房間恢復運作。
n|04:12　約9秒的空白，偶爾夾著細小的電流雜訊。特工吞嚥的聲音。
a|第五，通常能自己找到出口。有時它也會直接開門，省得我找。當然，不是每次都這麼方便啦。
n|05:20　特工發出短促的笑聲，隨即停止錄音。
a|……先這樣。剩下的，等下次確認過再補。`],
['06','TG-P-07 特殊實驗中止紀錄','特殊實驗紀錄　已中止<br>檔案：REC-██-06（TG-P-07）　錄製：20██/04/18　時間不明　時長：03:51（節錄）<br>來源：實驗場固定收音　訊號：不穩定',`n|00:00　空間持續變化、重疊的低鳴聲。金屬摩擦聲，約10秒。
n|00:38　裝置停止運作，低鳴聲隨之消失。出口重新開啟的聲響。
n|00:52　有人坐倒在地面，重物落地聲。此後再沒有移動的聲音。
u|結束了。
a|……嗯。
n|01:10　特工的呼吸聲粗重，間隔不規則。
u|出口已經開啟。你可以離開。
a|知道。
n|01:25　指節敲在牆面上，回聲比預期晚了半拍。
u|還能繼續嗎？
n|01:36　約45秒幾乎沒有聲音，只剩收音端的底噪與遠處漸弱的低鳴。
u|你不想繼續？
a|今天先不要了。
u|好。
n|02:44　特工吸了一口氣，語氣明顯放鬆了一些。
a|你這次弄得也太誇張了吧。
u|你曾經同意。
a|我知道，但我可沒說要弄成這樣啊！
u|我把你的同意理解成可以。
a|這就是問題所在。我說可以，不代表你什麼都能做。
u|我會記住。
a|希望如此。
n|03:40　特工低咳數聲。錄音在此處中斷。
o|研究部：特工仍保有拒絕權，但白日之影對「同意」的理解仍有明顯問題。
o|特工的呼吸聲與語速在 02:44 前後有明顯改變，推測他是在這時才恢復到能夠正常說話的狀態。`],
['09','TG-P-12 樓層結構崩解事件通訊紀錄','M.E.G.CN 通訊紀錄　完整<br>檔案：REC-██-09（TG-P-12）　錄製：20██/09/12　時間不明　時長：06:54<br>來源：特工隨身無線電（開放頻道，總部同步收錄）　訊號：弱，受空間扭曲影響',`n|00:00　空間重疊的低鳴聲壓過無線電底噪，其間夾著混凝土被緩慢拉扯的悶響，反覆錯位。
a|【開放頻道】這裡是特工，我現在位於異常區域，空間結構正在崩壞，請求支援，收到請回答，OVER。
n|00:19　無線電無回應，只有雜訊，約4秒。
a|……收不到嗎？算了，我繼續記錄。OVER。
n|00:31　空間低鳴聲變大。
a|喂，Shade！
s|你好，特工。
a|這次是怎麼回事？
s|他們弄壞了。
a|我看到了。
s|他們不願意停止。
a|我知道。
s|我可以讓他們消失。
a|先不要。
s|他們正在破壞這裡。
a|我知道，所以我才來了。
s|你要阻止我？
a|我想先跟他們談談。
s|他們不會聽。
a|那也得試過才知道吧？
n|01:24　急促的腳步聲，漸遠。
a|欸，各位！先停一下！
n|01:29　兩人以上同時說話，內容重疊，無法辨識。
o|進入者：你是誰？
a|M.E.G.CN 的探員。你們應該知道自己正在做什麼吧？
o|進入者：我們只是想出去！
a|我知道你們只是想出去。
o|進入者：那就別擋路！
a|但這裡不是只有你們。
o|進入者：關我們什麼事？
a|再這樣下去，所有人都會被困在這裡的！
o|進入者：那是你們的問題！
a|不是喔。這裡的空間已經開始崩壞了。你們再繼續破壞下去，連出口都會一起消失。
o|進入者：我們不相信你。
a|好吧，那我換個方式問。你們願不願意先停手，跟我一起離開？
n|03:02　對話中斷約8秒，通風口的送風聲低低地響著。
a|我不打算在這裡殺任何人。你們現在停下來，還有機會離開。
o|進入者：我們不需要你幫忙。
a|哎呀，這可真難辦。
n|03:30　10多秒的肢體碰撞聲，夾雜〔無法辨識〕的喊叫。
n|03:51　數個腳步聲與呼喊聲同時消失。遠處隱約傳來旋轉木馬般的音樂與人群嬉鬧聲，與樓層其他聲音格格不入，收音端出現爆音。
o|此段與 Level 995 的傳送紀錄一致（見根基事件）。
n|04:05　10多秒的肢體碰撞聲，隨後一聲悶響。
n|04:19　所有房間同時停止運作。機械聲、低鳴聲與遠處的呼喊一併斷掉，只剩特工急促而吃力的喘息。
s|還能繼續嗎？你受傷了。我可以修好。
a|先……不用。
s|他們傷害了你。我可以讓他們消失。
a|不要。
s|為什麼？
a|因為……他們已經不想繼續了。
s|但他們仍在破壞。
a|我知道。因為再繼續下去，就沒有任何人能離開了。
n|05:48　牆壁深處傳來沉重的摩擦聲，像整座建築正在重新咬合。一連串門板闔上的悶響由近至遠，遠處的呼喊被拉長、扭曲，最後驟然中斷。
n|06:51　無線電重新接通，只有雜訊，約3秒。錄音結束。
o|特工在 00:19 向總部發出的求援沒有收到任何回應；總部端錄音中亦未出現回覆。推測在此區域無線電只能單向發送。
o|研究部：不得解讀為特工能完全控制 Shade。\no|補充：傳送的對象與去向見根基事件。事件後樓層逐步恢復可通行狀態，但恢復過程沒有完整紀錄。
i|三個人同時說話。我分開排了，有一句沒排進去。`],
['P-06','選擇','特工聯絡對講機　TG-P-12 事件後<br>檔案：PRV-██-06　錄製：20██/09/16　時間不明　時長：03:14<br>來源：特工聯絡對講機　訊號：良好',`n|00:00　背景有輕微的衣料摩擦聲，特工似乎在調整坐姿，伴隨短促的吸氣聲。

['P-10','Shade','特工私人語音筆記　未提交<br>檔案：PRV-██-10　錄製：20██/11/03 04:10　時長：03:33<br>來源：特工聯絡對講機（語音筆記，自錄）　訊號：良好',`n|00:00　錄音開始。特工說話的聲音很低，像是怕吵醒誰。
a|它能改變整座樓層的空間結構，卻不明白為什麼人類離開前會回頭看一眼。它能干涉靈魂，卻不理解為什麼有人會為陌生人的死難過。
n|00:41　收音端安靜下來，約8秒，只有空調般的氣流聲。紙張翻動聲。

a|……我不知道這樣說對不對。可是我有點高興。這句別交給研究部。
n|01:35　約10秒沒有人說話，遠處管線傳來細微的水流聲。紙張翻動聲，筆尖劃過紙面的聲音。
n|01:50　另一個聲源進入收音範圍。距離比先前的錄音更近。
a|你到底為什麼這麼在意我？
s|因為你總會做出我無法預測的選擇。
a|只有這樣？
s|還有一個原因。
a|例如？
s|你會再次回來。這件事對我很重要。
n|02:33　約15秒只有紙張與衣料的細響，沒有人說話。
n|02:48　紙張被合起，椅腳在地面上挪動了一下。
a|……好吧。這個先不記了。
n|03:28　錄音停止。`],
['08','聲音模仿能力觀察紀錄','特工聯絡對講機　日常交流<br>檔案：REC-██-08　錄製：20██/02/11 16:20　時長：01:52<br>來源：特工聯絡對講機　訊號：良好',`n|00:00　開機提示音響起，背景有細微的電流聲。

n|01:34　只剩設備底噪，約8秒。

n|01:48　特工低聲笑了一下。錄音結束。
o|本檔案研究部標記為「聲紋比對無法使用」。Shade 的模仿含有特工的呼吸聲，與特工本人無法分辨。目前無法確認在其他檔案中，哪些部分的特工聲音是本人。`],
['P-03','疲倦','特工聯絡對講機　深夜<br>檔案：PRV-██-03　錄製：20██/01/23 00:47　時長：01:48<br>來源：特工聯絡對講機　訊號：良好',`n|00:00　開機提示音。腳步聲拖沓，比平常慢。

function recInit(){$('#main').onclick=e=>{const t=e.target;if(t.dataset.p!=null)play(+t.dataset.p);if(t.dataset.f!=null)play(+t.dataset.f,1);if(t.dataset.x!=null)tok++}}
nav();go('home');
</script>
<script>
/* ===== 互動層：符合樓層設定的小型互動。不計數、不編號、全收集也沒有額外獎勵 ===== */
(function(){
const q=(s,r=document)=>r.querySelector(s),qa=(s,r=document)=>[...r.querySelectorAll(s)];
const sl=ms=>new Promise(r=>setTimeout(r,ms)),pk=a=>a[Math.random()*a.length|0],shuf=a=>a.slice().sort(()=>Math.random()-.5);

/* ---------- 全域：它在觀察你的停留 ---------- */
const held=()=>!!q('dialog[open]')||!!document.querySelector('input:focus,textarea:focus,[contenteditable=true]:focus');
let last=Date.now(),idleN=0;['mousemove','keydown','scroll','touchstart','click'].forEach(x=>addEventListener(x,()=>{last=Date.now();idleN=0},{passive:true}));
const IDLE=['停住了？你停住的時候，呼吸比較小聲。','很久沒有動。牆也是。','還能繼續嗎？不想的話，可以停下來。'];
setInterval(()=>{const app=q('#app');if(!app||app.style.display!='block'||document.hidden||held()||cur=='rec'||cur=='talk')return;if(Date.now()-last>75000){toast(IDLE[idleN++%IDLE.length]);last=Date.now()}},5000);
const SQ={'出口':'出口在你右手邊。','你是誰':'我是這裡的。','還能繼續嗎':'不想的話，可以停下來。','救命':'我在。你可以先坐下。','門':'門沒有鎖。','杏仁水':'……背包深處，有人留了一瓶。','特工':'他今天沒有來，椅子有幫他留著。'};
q('#sq').addEventListener('input',e=>{const v=e.target.value.trim();if(SQ[v])toast(SQ[v])});

/* ---------- 白日之影・能力：點擊條目 ---------- */
const echoFx=()=>{['……緊張？','……你在嗎？','……這邊。'].forEach((t,i)=>{const e=document.createElement('div');e.textContent=t;e.style.cssText='position:fixed;z-index:60;pointer-events:none;font-size:.9rem;color:var(--mut);opacity:0;transition:opacity .6s;left:'+(6+Math.random()*78)+'%;top:'+(10+Math.random()*75)+'%';document.body.append(e);setTimeout(()=>e.style.opacity=.7,i*260);setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),700)},1500+i*260)})};
const SHFX={
'陰影顯現':()=>{shadowBlob();toast('某處的陰影動了一下。')},
'通訊干涉':li=>{li.animate([{opacity:1},{opacity:.15},{opacity:1},{opacity:.4},{opacity:1}],{duration:750});toast('（對講機雜音）……這邊。')},
'資訊接觸':li=>{li.classList.add('scan');setTimeout(()=>li.classList.remove('scan'),1500);toast('正在讀取：後室論壇。已讀取 ███ 則。')},
'聲音模仿':li=>{echoFx();toast('「你是不是有點緊張？」它學得很像你的語氣。')},
'空間干涉':li=>{li.classList.add('stretch');setTimeout(()=>li.classList.remove('stretch'),1600);toast('走廊變長了。你還在原地。')},
'環境調整':()=>{document.body.classList.add('dim');setTimeout(()=>document.body.classList.remove('dim'),1800);toast('亮度被調低了一些。')},
'遠距察覺':li=>{li.classList.add('gz');setTimeout(()=>li.classList.remove('gz'),2600);toast('它看見的，是你此刻停留的這一行。')},
'共生維持':()=>{const m=q('#main');m.classList.add('pulse');setTimeout(()=>m.classList.remove('pulse'),1800);toast('樓層與它，是同一個節奏。')},
'靈魂干涉':li=>{li.classList.add('ghost');setTimeout(()=>li.classList.remove('ghost'),1500);toast('身體跟自己，好像不太連得起來。')},
'形態變化':async()=>{for(const s of['無固定輪廓的黑色陰影……','聚合成近似人形……','輪廓不穩定，看不清五官……','散開了。']){toast(s);await sl(950)}}};
document.addEventListener('click',e=>{if(cur!='shade'||!q('#main').contains(e.target))return;const li=e.target.closest('li');if(!li)return;const b=li.querySelector('b');const f=b&&SHFX[b.textContent.trim()];if(f)f(li)});


/* ---------- 設定彩蛋：直接點頁面文字裡的特定詞，補充設定（不標示、不編號、無額外獎勵） ---------- */
const LORE=[
['白日之影','房間沒有光源，也沒有影子。唯一的影子，就是它。——據說，這是最早一批探索者替它取名的理由。（未證實）',1],
['實驗場','最早的口述裡，這裡叫「考場」。有人說在牆上看過考號，但沒有人記得自己的那一個。',1],
['紀錄器','有探索者把紀錄器帶出了房間。它在走廊上自己錄了十秒：內容是腳步聲，數起來是兩個人。',1,'anom'],
['負數','早期的計時器是往下數的。改成往上數，是出口變多以後的事。',1,'anom'],
['玻璃窗','有人隔著窗，對裡面的自己揮手。窗內的人沒有回應，但他身後的椅子，轉了過來。',1,'anom'],
['門框','看得見門框的人都說，框內側的牆紙花紋，是自己小時候住過的家。',1,'anom'],
['門鎖','鑰匙的齒紋，每個人數出來的數目都不同。離開房間後，沒有人記得它是怎麼到手的。',1,'anom'],
['七項','「七」是探索者自己數出來的。樓層從來沒有說過，一共有幾項。',1],
['Level 995','因果之地遊樂園的旋轉木馬音樂，只在有人被送去的時候響起。聽過的人，不想再聽第二次。',1],
['實驗中止','中止的瞬間，所有人都聽見同一個很小的聲音，像有人把筆放下。',1],
['白色立方體','牆面的白色，每個人看見的色溫都不同。它似乎在配合進入者。',1],
['沒有腳印','重複開門的人說，那些房間的地板，其實有過腳印，是被擦掉的，不是本來就沒有。',1],
['還能繼續嗎','這句話最早出現的時候，後面沒有問號。',2],
['長柄','鐮刃上的缺口，每一處，都對應一個沒有名字的東西。',2],
['原始姓名','姓名被取走的時候沒有任何痛覺。他只是在某一天，發現沒有人再用那個名字叫他。',3]];
function loreShow(t){let e=q('#lore');if(!e){e=document.createElement('div');e.id='lore';e.onclick=()=>e.classList.remove('on');document.body.append(e)}
 if(P[cur]&&(P[cur].l==1||!named))t=t.replace(/Shade/g,'白日之影');if(P[cur]&&P[cur].l==1)t=t.replace(/特工/g,'某探員');
 e.textContent=t;const sg=document.createElement('span');sg.className='it';sg.textContent='——整理';e.append(sg);e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),6500)}
function caret(x,y){let n,o;if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(x,y);if(r){n=r.startContainer;o=r.startOffset}}else if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(x,y);if(p){n=p.offsetNode;o=p.offset}}return n&&n.nodeType==3?[n,o]:null}
document.addEventListener('click',e=>{const m=q('#main');if(!m||!m.contains(e.target)||e.target.closest('summary,a,button,input,.fx,#lore'))return;if(String(getSelection()).length)return;const c=caret(e.clientX,e.clientY);if(!c)return;const [n,o]=c,v=n.nodeValue;
 for(const [k,t,min,pgid] of LORE){if(clr<min||(pgid&&pgid!=cur))continue;let i=v.indexOf(k);while(i>=0){if(o>=i-1&&o<=i+k.length+1){loreShow(t);return}i=v.indexOf(k,i+1)}}});
q('h1').addEventListener('click',e=>{if(e.target.id!='redh'&&q('#app').style.display=='block')loreShow('最早的口述裡，這裡叫「考場」。有人說在牆上看過考號，但沒有人記得自己的那一個。')});

/* ---------- 它在整理：被它動過手的地方，以手寫楷體標示 ---------- */
const TD={
home:[['乾淨','（擦過，兩次）']],
rules:[['不一定存在正確答案','（人類先看左邊）']],
shade:[['一般流浪者','來訪的人',1]],
base:[['物資存放處可能在無預警時被隔離','（拿走的東西，放在別處了）']],
exp:[['約六分鐘後右側出現門','（為什麼是六）']],
f2:[['未給出任何定義','（隱含，是藏起來的意思？）']],
inc:[['所有實驗暫停，房間停止崩解','（捧著，不會掉）']]};
let seenSh=false;try{seenSh=localStorage.getItem('lv616_seenSh')==='1'}catch(_){}
function tidy(id){if(!seenSh||!P[id]||P[id].l>clr)return;const root=q('#main');if(!root||q('.it.td',root))return;
 const EX='summary,h1,h2,h3,h4,a,button,.q,.meta,.fx,.it,.tools,.rel,.nm,.keep,[data-k],#lore,.stamp,.red';
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
 const put=(a,b,rep)=>{for(const n of ns){if(!n.isConnected)continue;const p=n.parentElement;if(!p||p.closest(EX))continue;const i=n.nodeValue.indexOf(a);if(i<0)continue;const mid=n.splitText(i),aft=mid.splitText(a.length),sp=document.createElement('span');sp.className='it td';sp.textContent=b;if(rep){sp.title='原文：'+a;mid.replaceWith(sp)}else mid.after(sp);ns.splice(ns.indexOf(n)+1,0,aft);return true}return false};
 for(const [a,b,r] of (TD[id]||[]))put(a,b,r);
 if(P[id].l>=3&&!q('p.it.end',root)){const e=document.createElement('p');e.className='it end';e.textContent='放好了。';root.append(e)}}
const _go2=go;go=function(id){if(cur==='shade'&&id!=='shade'&&!seenSh){seenSh=true;try{localStorage.setItem('lv616_seenSh','1')}catch(_){}}_go2(id);setTimeout(()=>tidy(id),0)};
const _go3=go;go=function(id){_go3(id);if(id==='shade')requestAnimationFrame(()=>q('#main').querySelectorAll('li').forEach(li=>{const b=li.querySelector('b');if(b&&SHFX[b.textContent.trim()]){li.tabIndex=0;li.setAttribute('role','button');li.setAttribute('aria-label','互動能力：'+b.textContent.trim())}}))};
document.addEventListener('keydown',e=>{if(cur!=='shade'||(e.key!=='Enter'&&e.key!==' '))return;const li=e.target.closest('#main li[role="button"]');if(!li)return;e.preventDefault();const b=li.querySelector('b'),f=b&&SHFX[b.textContent.trim()];if(f)f(li)});
try{console.log('%c整理中……\n你翻到了牆的後面。那裡沒有東西。','font-family:serif;font-size:14px;color:#a899e0')}catch(e){}

/* 腳註：點上標彈出文字卡 */
(()=>{let card=null,src=null;const hide=()=>{if(card){card.remove();card=null;src=null}};
document.addEventListener('click',e=>{const f=e.target.closest('sup.fn');
if(!f||!$('#main').contains(f)){if(card&&!e.target.closest('#fncard'))hide();return}
if(src===f){hide();return}hide();
const n=parseInt(f.textContent.replace(/\D/g,''),10);const bs=[...$('#main').querySelectorAll('.fnb')];const box=bs.find(b=>f.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING)||bs[bs.length-1];if(!box)return;const li=box.querySelectorAll('ol>li')[n-1];if(!li)return;
card=document.createElement('div');card.id='fncard';card.innerHTML='<b>腳註 '+n+'</b>'+li.innerHTML;src=f;document.body.append(card);
const r=f.getBoundingClientRect(),w=card.offsetWidth,x=Math.max(8,Math.min(innerWidth-w-8,r.left+scrollX-w/2+r.width/2));
card.style.left=x+'px';card.style.top=(r.bottom+scrollY+8)+'px'});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});})();
})();
</script></body></html>
